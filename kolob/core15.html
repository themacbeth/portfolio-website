<script>
var POD="kolob-pod-1d.html";
// KOLOB is the axis-mundi at the galaxy centre, not mintable.
// The 15 mintable pieces: 3 triangle great stars + 12 governing systems.
var SUNS=[
 {n:"Oleblish",         c:"#f7e7a8", d:"Golden first of the triangle, blazing in measured rotation."},
 {n:"Enish-go-on-dosh", c:"#7fc8ff", d:"Blue and restless, ringed with countless orbiting elements."},
 {n:"Kai-e-vanrash",    c:"#ff8a52", d:"The red giant with long curling tongues of flame."}
];
var CORES=[
 {n:"Lindi",         p:"Ringed Dynasty",       c:"#f7e7a8"},
 {n:"Zip",           p:"Moon Swarm",           c:"#cfd6ff"},
 {n:"Vusel",         p:"Asteroid Empire",      c:"#d9c08a"},
 {n:"Vauiste",       p:"Comet Storm",          c:"#7fe0ff"},
 {n:"Waine",         p:"Embryo Nursery",       c:"#9aa6e6"},
 {n:"Way-ho-ox-oan", p:"Eccentric Chaos",      c:"#ff7fbf"},
 {n:"Oansli",        p:"Binary Heart",         c:"#ffd27f"},
 {n:"Kible",         p:"Resonance Cathedral",  c:"#bfe0ff"},
 {n:"Shineflis",     p:"Frozen Kuiper",        c:"#9fe6ff"},
 {n:"Flis",          p:"Hot-Jupiter Forge",    c:"#ff8a52"},
 {n:"Os",            p:"Mega-Ring World",      c:"#ffe6a8"},
 {n:"Ondi",          p:"Trojan Swarms",        c:"#d9c08a"}
];
// Authored badge: piece has been sealed in Creator Mode (localStorage payload exists)
function isAuthored(kind,i){try{return !!localStorage.getItem('kolob:'+kind+':'+i);}catch(e){return false;}}
function authoredName(kind,i){try{var v=JSON.parse(localStorage.getItem('kolob:'+kind+':'+i)||'null');
  return (v&&v.name)?v.name:null;}catch(e){return null;}}
function badge(kind,i){return isAuthored(kind,i)?'<span class="auth">✦ Authored</span>':'';}
var sH="";
SUNS.forEach(function(s,i){
  var an=authoredName('sun',i)||s.n;
  sH+='<a class="card live" href="token.html?inv='+i+'">'+
    '<div class="swatch"><iframe class="liveframe" scrolling="no" data-src="token.html?inv='+i+'&lite=1" title="'+an+'"></iframe></div>'+
    '<span class="k">Great Star '+(i+1)+' / 3 · locked · auction'+badge('sun',i)+'</span>'+
    '<h3>'+an+'</h3><p>'+s.d+'</p></a>';
});
document.getElementById('suns').innerHTML=sH;
var cH="";
CORES.forEach(function(s,i){
  var an=authoredName('core',i)||s.n;
  cH+='<a class="card live" href="token.html?inv='+(3+i)+'">'+
    '<div class="swatch"><iframe class="liveframe" scrolling="no" data-src="token.html?inv='+(3+i)+'&lite=1" title="'+an+'"></iframe></div>'+
    '<span class="k">Core '+(i+1)+' / 12 · locked · auction'+badge('core',i)+'</span>'+
    '<h3>'+an+'</h3><p class="dim">'+s.p+'</p></a>';
});
document.getElementById('cores').innerHTML=cH;
// Still-thumbnail mode: load each piece on approach, let it render to its iconic
// frame, then freeze it (stop animating) — no ongoing render cost, no page lag.
var io=new IntersectionObserver(function(es){es.forEach(function(e){
  var f=e.target;
  if(e.isIntersecting){
    if(!f.dataset.loaded){ f.dataset.loaded='1'; f.src=f.dataset.src;   // load once
      f.addEventListener('load',function(){
        setTimeout(function(){ try{f.contentWindow.postMessage('kolob:pause','*');}catch(_){} },2800); });
    }
  } else {
    try{f.contentWindow.postMessage('kolob:pause','*');}catch(_){}       // pause if scrolled away mid-warmup
  }
});},{rootMargin:'120px',threshold:0.01});
document.querySelectorAll('.liveframe').forEach(function(f){io.observe(f);});
</script>
