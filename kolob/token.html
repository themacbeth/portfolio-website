<script>
"use strict";
var TAU=6.28318530718;

/* ── deterministic PRNG (hash-seeded) ── */
function hashSeed(h){var s=0;for(var i=2;i<h.length;i++) s=(Math.imul(s,16)+parseInt(h[i],16)+1)|0;return s>>>0;}
function PRNG(seed){var a=seed^0x9e3779b9,b=seed^0x243f6a88,c=seed^0xb7e15162,d=1;
  return function(){a|=0;b|=0;c|=0;d|=0;var t=(a+b|0)+d|0;d=d+1|0;
    a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);c=c+t|0;return (t>>>0)/4294967296;};}
function mk(seed){var r=PRNG(seed>>>0);
  r.rng=function(a,b){return a+(b-a)*r();};
  r.int=function(a,b){return a+((r()*(b-a+1))|0);};
  r.pick=function(x){return x[(r()*x.length)|0];};
  r.g=function(){var u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};
  return r;}

/* ── PostParams (tier + Creator-mode overrides) ── */
function pmp(){try{return tokenData.externalAssetDependencies[0].data||{};}catch(e){return {};}}
var PP=pmp();
function ppInt(k,d){var n=parseInt(PP[k]);return isNaN(n)?d:n;}
function ppFlt(k,d){var n=parseFloat(PP[k]);return isNaN(n)?d:n;}            // float field
function ppStr(k,d){var v=PP[k];return (typeof v==='string'&&v.length)?v:d;}  // string field
function ppCol(k,d){var v=PP[k];if(v==null)return d;                          // colour: "#rrggbb" or int
  if(typeof v==='number'){return [(v>>16)&255,(v>>8)&255,v&255];}
  var m=String(v).match(/^#?([0-9a-f]{6})$/i); if(!m) return d;
  var n=parseInt(m[1],16); return [(n>>16)&255,(n>>8)&255,n&255];}

/* ── which piece is this token? ── */
var INV=(function(){var u=new URLSearchParams(location.search),q=u.get('inv');
  if(q!=null)return +q;
  var tid=parseInt(String(tokenData.tokenId).split('-').pop())||0;return tid%1000000;})();
/* For preview / capture (?inv=N), synthesize a per-piece hash so each invocation
   exercises its own seed. In production Art Blocks supplies a real unique hash
   for every mint, so this branch is dormant. */
if(new URLSearchParams(location.search).has('inv') && INV>=15){
  var _h='0x';
  for(var _i=0;_i<32;_i++){
    var _b=((INV*73856093+_i*19349663+0xDEADBEEF)>>>0)%256;
    _h+=('0'+_b.toString(16)).slice(-2);

  tokenData={hash:_h, tokenId:String(144000000+INV),
    externalAssetDependencies:tokenData.externalAssetDependencies};
}

/* ── palette + colour helpers (locked: PURE_ICE) ── */
var P={c0:[200,235,255],c1:[220,230,255],c2:[235,242,255],c3:[250,252,255],
       c4:[200,215,240],bg:[5,7,14],accent:[255,255,255],star_shift:-0.3};
function sh(c,f){f=Math.min(1.5,f*1.3);return[Math.min(255,c[0]*f),Math.min(255,c[1]*f),Math.min(255,c[2]*f)];}
function lt(c,f){f=Math.min(1,f*1.3);return[c[0]+(255-c[0])*f,c[1]+(255-c[1])*f,c[2]+(255-c[2])*f];}
function mix(a,b,f){return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
function sat(c,k){var m=(c[0]+c[1]+c[2])/3,cl=function(x){return x<0?0:x>255?255:x;};
  return[cl(m+(c[0]-m)*k),cl(m+(c[1]-m)*k),cl(m+(c[2]-m)*k)];}
function rs(c){return"rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";}
function hsl(h,s,l){h=((h%360)+360)%360/360;
  function f(n){var k=(n+h*12)%12;return 255*(l-s*Math.min(l,1-l)*Math.max(-1,Math.min(k-3,9-k,1)));}
  return [f(0),f(8),f(4)];}
function makePalette(R){var h0=R()*360,sc=R.int(0,2),spread=sc===0?28:sc===1?120:150;
  function H(d,s,l){return hsl(h0+d,s,l);}
  return {hue:h0,scheme:sc,rocky:H(R.rng(-18,18),0.34,0.56),gas:H(0,0.82,0.62),
    ice:H(spread,0.74,0.64),hot:H(-spread,0.86,0.58),star:H(R.rng(-14,14),0.58,0.74),
    belt:H(R.rng(8,32),0.52,0.60),comet:H(spread*0.7+150,0.72,0.74)};}
function palType(p,t){return t===0?p.rocky:t===1?p.gas:t===2?p.ice:p.hot;}

/* ── names ── */
// KOLOB is the axis-mundi (non-mintable). The 15 pieces: 3 triangle great stars + 12 governing systems.

 "is","es","hah","beam","rauk","yang","shin","ehah","jah","oh","eh","gno","laum","kok","ob","ole","a","flo","eese","seth"];
function aname(r){var n=r.int(2,3),s="";for(var i=0;i<n;i++)s+=r.pick(SYL);return s.charAt(0).toUpperCase()+s.slice(1);}

/* ── stellar classification ── */
var S0=0.05*P.star_shift;
var STAR=[
 {c:"O",col:[120+S0*200,225,255],t:"blue",w:0.003,rad:5.2},
 {c:"B",col:[70+S0*200,205,255],t:"blue-white",w:0.13,rad:3.1},
 {c:"A",col:[235,245,255],t:"white",w:0.61,rad:1.7},
 {c:"F",col:[255,250,225],t:"yellow-white",w:3.0,rad:1.3},
 {c:"G",col:[255,221,55],t:"yellow",w:7.6,rad:1.05},
 {c:"K",col:[255,142+S0*100,40],t:"orange",w:12,rad:0.82},
 {c:"M",col:[248,46+S0*200,118],t:"red",w:76,rad:0.5}];
var STARW=(function(){var s=0,a=[];for(var i=0;i<STAR.length;i++){s+=STAR[i].w;a.push(s);}return{a:a,t:s};})();
function pickStar(r){var x=r()*STARW.t;for(var i=0;i<STARW.a.length;i++) if(x<STARW.a[i]) return i;return 6;}
var CHAINS=[[16,8,4,2,1],[18,12,8,6,4,3,2],[24,12,6,3,2,1],[12,8,6,4,3,2],
 [24,16,12,9,6,4,3],[30,20,12,8,6,4,2],[16,12,8,6,4,3,2],[20,10,5,3,2,1],
 [27,18,12,8,6,4],[32,16,8,6,4,3,2]];

/* ── locked core identities ── */
var CORE_SEEDS=[0x4B4F4C00,0x4B414505,0x4B4C4909,
  0x0C0DE101,0x0C0DE202,0x0C0DE303,0x0C0DE404,0x0C0DE505,0x0C0DE606,
  0x0C0DE707,0x0C0DE808,0x0C0DE909,0x0C0DEA0A,0x0C0DEB0B,0x0C0DEC0C];
var SUN_PARAMS=[
 {col:[255,234,168],size:1.30,density:0.92,noise:1.0,speed:0.65,length:1.30,curl:2.2,rot:0.45,orbit:0.55,big:0.16},
 {col:[150,212,255],size:0.95,density:0.74,noise:1.4,speed:1.70,length:0.65,curl:4.6,rot:1.50,orbit:0.95,big:0.07},
 {col:[255,116,64], size:1.18,density:0.55,noise:1.1,speed:0.50,length:1.45,curl:6.8,rot:0.30,orbit:0.22,big:0.22}];
var CORE_PROFILES=["RINGED DYNASTY","MOON SWARM","ASTEROID EMPIRE","COMET STORM","EMBRYO NURSERY",
 "ECCENTRIC CHAOS","BINARY HEART","RESONANCE CATHEDRAL","FROZEN KUIPER","HOT-JUPITER FORGE","MEGA-RING WORLD","TROJAN SWARMS"];
var TIER_NAMES=["CELESTIAL","TERRESTRIAL","TELESTIAL"];

/* ── particle-cluster template (planet bodies): 3200 pts + 14-level shading
   ramp + 1px points = smooth spheres (the old 220/4-band read as "Lego"). ── */
var CTPL=(function(){var r=mk(20260516),a=[];for(var i=0;i<3200;i++){var ang=r()*TAU,rad=Math.sqrt(r());
  a.push([Math.cos(ang)*rad,Math.sin(ang)*rad,Math.sqrt(Math.max(0,1-rad*rad))]);}return a;})();
function ccount(r,px){var n=(r/px)*(r/px)*3.4|0;return n<12?12:n>3200?3200:n;}
function shadeLut(base){var L=14,lut=[],li,f;
  for(li=0;li<L;li++){f=li/(L-1);
    lut.push(rs(f<0.5?sh(base,0.36+f*1.28):lt(base,(f-0.5)*0.9)));}
  return lut;}
function cluster(sx,sy,r,base,count,rot,px,plotFn){var c=Math.cos(rot),s=Math.sin(rot);
  var lut=shadeLut(base),L=lut.length;
  for(var i=0;i<count;i++){var p=CTPL[i];var dx=p[0]*c-p[1]*s,dy=p[0]*s+p[1]*c;
    var b=dx*-0.45+dy*-0.5+p[2]*0.74;
    var f2=(b+1.0)/2.0;if(f2<0)f2=0;if(f2>1)f2=1;
    plotFn(sx+dx*r,sy+dy*r,lut[(f2*(L-1))|0]);}}
/* textured planet surfaces: 2D LUT [shade 14][surface 6], lambert × base→accent
   blend; surface value from a per-type field (gas bands · rocky mottle · swirl)
   sampled in sphere space and scrolled by spin. Stays on the CMYK palette. */
var SHADE_L=14,SURF_L=6;
function texLut(base,acc){var lut=new Array(SHADE_L),li,si;
  for(li=0;li<SHADE_L;li++){var f=li/(SHADE_L-1);
    var sB=f<0.5?sh(base,0.36+f*1.28):lt(base,(f-0.5)*0.9);
    var sA=f<0.5?sh(acc ,0.36+f*1.28):lt(acc ,(f-0.5)*0.9);
    var row=new Array(SURF_L);
    for(si=0;si<SURF_L;si++) row[si]=rs(mix(sB,sA,si/(SURF_L-1)));
    lut[li]=row;}
  return lut;}
function planetBody(sx,sy,r,base,acc,spin,style,bands,nseed,plotFn){
  var lut=texLut(base,acc),count=ccount(r,Math.max(0.5,PLANPX*dpr));
  var cs=Math.cos(spin),sn=Math.sin(spin);
  for(var i=0;i<count;i++){var p=CTPL[i];
    var vx=p[0],vy=p[1],vz=p[2];
    var b=vx*-0.45+vy*-0.5+vz*0.74;
    var f2=(b+1.0)/2.0;if(f2<0)f2=0;if(f2>1)f2=1;
    var li=(f2*(SHADE_L-1))|0;
    var tx=vx*cs-vz*sn,tz=vx*sn+vz*cs,ty=vy;
    var sv;
    if(style===1){var w=vnoise(tx*1.4+nseed,ty*2.2,tz*1.4)-0.5;sv=0.5+0.5*Math.sin(ty*bands+w*1.6);}
    else if(style===2){var w2=vnoise(tx*1.1+nseed,ty*1.6,tz*1.1)-0.5;sv=0.5+0.42*Math.sin(ty*(bands*0.6)+w2*1.0);}
    else if(style===3){sv=(fbm(tx*2.3+nseed,ty*2.3,tz*2.3)-0.34)*2.0;}
    else{sv=vnoise(tx*3.1+nseed,ty*3.1,tz*3.1)*1.15-0.08;}
    if(sv<0)sv=0;if(sv>1)sv=1;
    plotFn(sx+vx*r,sy+vy*r,lut[li][(sv*(SURF_L-1))|0]);}}

/* ── noise (for the great suns) ── */
function hash3(x,y,z){var n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177))|0;
  n=(n^(n>>>13))|0;n=Math.imul(n,1274126177)|0;return((n^(n>>>16))>>>0)/4294967296;}
function vnoise(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,
  u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);function L(a,b,k){return a+(b-a)*k;}
  return L(L(L(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),L(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
           L(L(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),L(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z){var s=0,a=0.5,f=1;for(var o=0;o<3;o++){s+=a*vnoise(x*f,y*f,z*f);f*=2.03;a*=0.5;}return s;}
function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(v){var l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
/* Core / throne mini particle sun — the great-star engine, scaled & simplified */
var _csData=null,_csSeed=null;
function buildCoreStar(seed,nS){var r=mk(seed>>>0),arr=[],i;
  for(i=0;i<nS;i++){var u=r()*TAU,ct=2*r()-1,st=Math.sqrt(1-ct*ct),d=[st*Math.cos(u),st*Math.sin(u),ct];
    var up=Math.abs(d[1])<0.92?[0,1,0]:[1,0,0],t1=norm(cross(d,up)),t2=cross(d,t1),erupt=r()<0.17;
    arr.push({d:d,t1:t1,t2:t2,ph:r()*40,tipExt:erupt?(0.8+r()*1.0):(0.2+r()*0.35),amp:0.6+r()*0.9,coil:2.0+r()*3.0,flow:0.2+r()*0.5,bri:0.6+r()*0.6});}
  return arr;}
function renderCoreStar(cx,cy,rad,seed,col,nS,NK){
  var key=(seed^(nS<<16))>>>0;
  if(_csSeed!==key){_csData=buildCoreStar(seed,nS);_csSeed=key;}
  var arr=_csData,t=clock*0.013,spin=az+clock*0.011,cosS=Math.cos(spin),sinS=Math.sin(spin),cosT=Math.cos(tilt),sinT=Math.sin(tilt);
  var cr=col[0]|0,cg=col[1]|0,cb=col[2]|0,INVk=1/(NK-1),i,k;
  var D=Math.max(1,U-1);
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<arr.length;i++){var sd=arr[i],tw=t*sd.flow+sd.ph,bx=sd.d[0]*1.6,by=sd.d[1]*1.6,bz=sd.d[2]*1.6;
    for(k=0;k<NK;k++){var u=k*INVk,f=u*u,amp=(0.10+f*0.7)*sd.amp;
      var na=fbm(bx+f*sd.coil+tw,by,bz)-0.44,nb=fbm(by,bz+f*sd.coil+tw,bx)-0.44,rr=1.0+sd.tipExt*f+na*0.1;
      var px=sd.d[0]+sd.t1[0]*na*amp+sd.t2[0]*nb*amp,py=sd.d[1]+sd.t1[1]*na*amp+sd.t2[1]*nb*amp,pz=sd.d[2]+sd.t1[2]*na*amp+sd.t2[2]*nb*amp;
      var pl=Math.sqrt(px*px+py*py+pz*pz)||1;pl=rr/pl;px*=pl;py*=pl;pz*=pl;
      var rx=px*cosS-pz*sinS,rz=px*sinS+pz*cosS,sx=cx+rx*rad,sy=cy+(py*cosT-rz*sinT)*rad;
      var a=sd.bri*(0.22-f*0.15);if(a<0.03)a=0.03;if(a>1)a=1;
      ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+a.toFixed(3)+')';ctx.fillRect(sx,sy,D,D);}}
  ctx.globalCompositeOperation='source-over';}

/* ── orbit modeling ── */
function kepler(M,e){M=M%TAU;var E=M;for(var i=0;i<5;i++) E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));return E;}
function orbit(a,e,peri,inc,M){var E=kepler(M,e);var ox=a*(Math.cos(E)-e),oy=a*Math.sqrt(1-e*e)*Math.sin(E);
  var px=ox*Math.cos(peri)-oy*Math.sin(peri),py=ox*Math.sin(peri)+oy*Math.cos(peri);
  return [px,py*Math.cos(inc),py*Math.sin(inc)];}

/* ── canvas + 1px additive pixel buffer (the PXL-pod move) ── */
var cv=document.querySelector('canvas'),ctx=cv.getContext('2d');
var W,H,CX,CY,U,PX,scaleRef,dpr,imgD=null,buf=null;
var IS_MOBILE=(typeof matchMedia!=="undefined"&&matchMedia('(max-width:760px),(pointer:coarse)').matches)||false;
/* per-tier field/planet pixel sizes (baked from the tier in the build site) */
var FIELD=1.5,PLANPX=0.75,FW=3,FI=1,GHOSTS=2;
function syncPx(){var s=FIELD*(dpr||1);
  if(s<=0.01){FI=0;FW=1;return;}
  FW=Math.max(1,Math.min(4,Math.ceil(s)));FI=(s/FW)*(s/FW);}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=cv.width=Math.floor(innerWidth*dpr);H=cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
  CX=W/2;CY=H/2;
  U=Math.max(2,Math.round(Math.min(W,H)/470));     // size unit for bodies
  PX=U;                                            // legacy alias
  scaleRef=Math.min(W,H)*0.46;
  imgD=ctx.createImageData(W,H);buf=imgD.data;
  syncPx();
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}
addEventListener('resize',resize);resize();
/* additive plot into the buffer — clamped by Uint8ClampedArray. */
function bplot(x,y,r,g,b){
  if(FI<=0)return;
  var xi=x|0,yi=y|0;
  if(xi<0||yi<0||xi>W-FW||yi>H-FW)return;
  var rr=r*FI|0,gg=g*FI|0,bb=b*FI|0;
  for(var dy=0;dy<FW;dy++){var o=((yi+dy)*W+xi)*4;
    for(var dx=0;dx<FW;dx++){buf[o]+=rr;buf[o+1]+=gg;buf[o+2]+=bb;buf[o+3]=255;o+=4;}}}

/* ── view (light interactivity for the live view) ── */
// Seed-deterministic clock offset so thumbnails capture an iconic spread frame, not the t=0 cluster.
var az=0,tilt=0.52,zoom=1,clock=( (function(){try{
  var s=parseInt(String(tokenData.tokenId).slice(-8),16)||hashSeed(tokenData.hash||'0x0');
  return (s%1373)*0.7;
}catch(e){return 0;}})() );
var drag=false,lx=0,ly=0;
cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){if(!drag)return;az+=(e.clientX-lx)*0.006;tilt=Math.max(0.12,Math.min(1,tilt+(e.clientY-ly)*0.004));lx=e.clientX;ly=e.clientY;});
cv.addEventListener('pointerup',function(){drag=false;});
cv.addEventListener('wheel',function(e){e.preventDefault();zoom*=Math.exp(-e.deltaY*0.0012);zoom=Math.max(0.3,Math.min(9,zoom));},{passive:false});

/* ── render primitives ── */
/* star-forward composition: seeded zoom-in + off-centre framing (set per piece).
   Aspect-aware: portrait viewports dial back the off-center offset & zoom so
   the system never slides off-frame; recomputed each frame so rotation
   re-frames automatically. */
var vZoom=1,vOffX=0,vOffY=0;
function _portraitT(){var a=W/H;return a<1?Math.min(1,a/0.9):1;}
function vcx(){return CX+vOffX*W*_portraitT();}
function vcy(){return CY+vOffY*H*_portraitT();}
function _effZoom(){var p=_portraitT();return vZoom*(0.45+0.55*p);}
function project(x,y,z,cosP,sinP,scale){var rx=x*cosP-y*sinP,ry=x*sinP+y*cosP;

    _aused.push(root*0.5);
    _voice(root*0.5,0.18,0.013,2);                  // the star, a deep drone
    if(system.binary&&_addF(root*0.75))_voice(root*0.75,0.09,0.017,3);
    for(i=0;i<nv;i++){var f=root*pls[i].rev/rmin;
      while(f>root*3.98)f*=0.5;                     // fold into two octaves
      if(!_addF(f))continue;                        // resonance already sounded
      _voice(f,0.15/Math.sqrt(nv),0.02+pls[i].rev*0.004,2+i*1.5);}
  }}
function _audioSet(on){
  _audioOn=on;
  if(_ac)_amg.gain.setTargetAtTime(on?0.5:0,_ac.currentTime,0.9);
  if(_abtn)_abtn.style.opacity=on?'0.85':'0.28';}
function _audioToggle(){
  if(system&&system._od)return;                     // Outer Darkness is silent
  if(!_ac)_audioBuild();
  if(_ac.state==='suspended')_ac.resume();
  _audioSet(!_audioOn);}
if(!LITE){
  _abtn=document.createElement('div');_abtn.textContent='♪';
  _abtn.title=(system&&system._od)?'Outer Darkness is silent':'orbital resonance, sounded (A)';
  _abtn.style.cssText='position:fixed;right:12px;bottom:10px;z-index:40;cursor:pointer;'+
    'font:16px/1 ui-monospace,monospace;color:#fff;padding:8px;user-select:none;'+
    'transition:opacity .9s;opacity:'+((system&&system._od)?'0.10':'0.28');
  _abtn.addEventListener('click',_audioToggle);
  document.body.appendChild(_abtn);}

/* ── view keys: S save still · M monochrome · K shortcut key ── */
var _mono=false,_kmap=null;
function _saveStill(){var a=document.createElement('a');
  a.download='kolob_inv'+('00'+INV).slice(-3)+(_mono?'_mono':'')+'.png';
  a.href=cv.toDataURL('image/png');a.click();}
function _monoToggle(){_mono=!_mono;
  cv.style.filter=_mono?'grayscale(1) contrast(1.12)':'';}
function _kmapToggle(){
  if(LITE)return;
  if(!_kmap){
    _kmap=document.createElement('div');
    _kmap.style.cssText='position:fixed;left:14px;bottom:12px;z-index:41;'+
      'font:10px/2 ui-monospace,monospace;color:#9aa0ad;letter-spacing:.06em;'+
      'background:rgba(0,0,0,.55);padding:10px 16px;border:1px solid rgba(255,255,255,.12);'+
      'transition:opacity .9s;user-select:none';
    _kmap.innerHTML=
      '<b style="color:#fff">A</b> &nbsp;sound · orbital resonance<br>'+
      '<b style="color:#fff">M</b> &nbsp;monochrome<br>'+
      '<b style="color:#fff">S</b> &nbsp;save a still<br>'+
      '<b style="color:#fff">[ ]</b> orbit speed<br>'+
      '<b style="color:#fff">drag</b> rotate<br>'+
      '<b style="color:#fff">K</b> &nbsp;close this key';
    document.body.appendChild(_kmap);
  } else _kmap.style.display=(_kmap.style.display==='none')?'block':'none';}
/* idle: the chrome fades away, any movement brings it back */
var _idleT=null;
function _chromeFade(hide){
  if(_abtn)_abtn.style.opacity=hide?'0':((system&&system._od)?'0.10':(_audioOn?'0.85':'0.28'));
  if(_kmap)_kmap.style.opacity=hide?'0':'1';}
function _poke(){_chromeFade(false);clearTimeout(_idleT);
  _idleT=setTimeout(function(){_chromeFade(true);},9000);}
if(!LITE){
  addEventListener('pointermove',_poke);addEventListener('pointerdown',_poke);
  addEventListener('keydown',_poke);_poke();}

/* ── loop ── */
var renderPaused=false;   // embeds pause when scrolled off-screen (no effect on AB)
var _tspd=0.15;           // orbit speed; [ ] keys adjust at runtime
addEventListener('message',function(e){var d=e&&e.data;
  if(d==='kolob:pause'){renderPaused=true; if(_ac&&_audioOn)_ac.suspend();}
  else if(d==='kolob:play'){renderPaused=false; if(_ac&&_audioOn)_ac.resume();}});
addEventListener('keydown',function(e){
  if(e.key===']') _tspd=Math.min(1.2,_tspd*1.5);
  else if(e.key==='[') _tspd=Math.max(0.03,_tspd/1.5);
  else if(e.key==='a'||e.key==='A') _audioToggle();
  else if(e.key==='m'||e.key==='M') _monoToggle();
  else if(e.key==='s'||e.key==='S') _saveStill();
  else if(e.key==='k'||e.key==='K'||e.key==='?') _kmapToggle();
});
function loop(){ if(renderPaused){requestAnimationFrame(loop);return;}
  clock+=_tspd; if(mode==='star') renderStar(); else renderSystem(); requestAnimationFrame(loop);}
loop();
</script>
