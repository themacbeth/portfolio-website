<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>KOLOB</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{font:11px/1.55 ui-monospace,Menlo,Consolas,monospace;color:#c2cbdb}
  #c{display:block;background:#000;cursor:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2724%27 height=%2724%27 viewBox=%270 0 24 24%27%3E%3Cpolygon points=%2712,5 4,19 20,19%27 fill=%27white%27/%3E%3C/svg%3E") 12 12,grab;touch-action:none;image-rendering:pixelated}
  #c:active{cursor:grabbing}
  #hud{position:fixed;left:14px;top:12px;white-space:pre;
       pointer-events:none;letter-spacing:.04em;text-shadow:0 0 4px #000;
       max-width:calc(100vw - 28px);overflow:hidden;z-index:50}
  #hud b{color:#f2f2f8}
  #hud .throne{font-size:28px;line-height:1.2;color:#fff}
  #hud .tier{font-size:14px;color:#888}
  #controls{position:fixed;left:14px;bottom:24px;z-index:100;display:flex;gap:6px;align-items:center}
  #controls label{color:#666;font:10px ui-monospace,monospace}
  #throneNum{width:92px;background:rgba(20,20,35,0.9);border:1px solid rgba(255,255,255,0.12);
    color:#ddd;padding:6px 8px;border-radius:3px;font:12px ui-monospace,monospace;
    text-align:center;outline:none;-webkit-appearance:none}
  #throneNum:focus{border-color:rgba(255,255,255,0.3);background:rgba(30,30,50,0.95)}
  #throneGo{background:rgba(30,30,50,0.85);border:1px solid rgba(255,255,255,0.12);
    color:#ccc;padding:6px 10px;border-radius:3px;font:11px ui-monospace,monospace;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  #throneGo:active{background:rgba(50,50,80,0.9)}
  #back{position:fixed;left:14px;bottom:60px;z-index:100;
    background:rgba(30,30,50,0.85);border:1px solid rgba(255,255,255,0.15);
    color:#ddd;padding:8px 14px;border-radius:4px;
    font:12px ui-monospace,monospace;cursor:pointer;display:none;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #back:active{background:rgba(60,60,90,0.9)}
  #mintInfo{display:none}
  /* SLIDESHOW CONTROLS OVERLAY */
  #slideshowUI{
    position:fixed;right:14px;bottom:72px;z-index:205;
    display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:252px;
    background:rgba(8,8,14,0.82);border:1px solid rgba(255,255,255,0.1);
    border-radius:9px;padding:8px;backdrop-filter:blur(3px);
    opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
  #slideshowUI.visible{opacity:1;transform:none;pointer-events:all}
  .ssBtn{
    min-width:36px;height:34px;background:rgba(24,24,40,0.92);
    border:1px solid rgba(255,255,255,0.18);border-radius:5px;
    color:#aab;cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-size:13px;user-select:none;-webkit-tap-highlight-color:transparent;
    transition:background 0.15s,color 0.15s}
  .ssBtn:hover{background:rgba(50,50,100,0.95);color:#fff}
  .ssBtn:active{background:rgba(70,70,130,0.95)}
  #slideshowQueue{
    font:10px ui-monospace,monospace;color:#667;background:rgba(10,10,20,0.85);
    border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:4px 8px;
    white-space:nowrap;overflow:hidden;max-width:160px;text-overflow:ellipsis}
  #ssHold.on{background:rgba(80,200,120,0.9);color:#fff;border-color:rgba(120,255,180,0.4)}
  .ssSpd.on{background:rgba(80,120,200,0.9);color:#fff;border-color:rgba(160,200,255,0.4)}
  #ssGpu.on{background:rgba(150,120,255,0.9);color:#fff;border-color:rgba(180,160,255,0.5)}
  #ssFs.on{background:rgba(80,200,120,0.9);color:#fff;border-color:rgba(120,255,180,0.4)}

  #hud .throne{font-size:18px}#controls{left:8px;bottom:16px}
  #throneNum{width:80px;padding:5px 6px;font-size:11px}
  #back{left:8px;bottom:30px;padding:8px 10px;font-size:10px}
  #mintInfo{right:8px;top:8px;font-size:8px}
  #slideshowUI{right:8px;bottom:64px;max-width:calc(100vw - 16px)}}
</style>

<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<!-- Boot intro: KOLOB wordmark on first visit (skip on embeds, hero, reduced-motion) -->
<div id="bootIntro" aria-hidden="true">
  <div class="bk">KOLOB</div>
  <div class="bs">a galaxy drawn by the chain</div>
</div>
<style>
  #bootIntro{position:fixed;inset:0;z-index:9999;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    pointer-events:none;animation:bootFade 2.8s ease-out forwards}
  #bootIntro .bk{font:600 clamp(34px,8vw,80px) Jost,Inter,system-ui,sans-serif;
    letter-spacing:.34em;color:#fff;text-shadow:0 0 22px rgba(255,255,255,0.35);
    opacity:0;animation:bootIn 1.3s ease-out forwards}
  #bootIntro .bs{margin-top:20px;font:11px/1.6 ui-monospace,monospace;color:#9aa0ad;
    letter-spacing:.24em;text-transform:uppercase;
    opacity:0;animation:bootInSlow 1.7s 0.5s ease-out forwards}
  @keyframes bootIn{
    0%{opacity:0;letter-spacing:.6em;filter:blur(10px)}
    55%{opacity:1;letter-spacing:.34em;filter:blur(0)}
    100%{opacity:1;letter-spacing:.34em}}
  @keyframes bootInSlow{from{opacity:0;transform:translateY(8px)}to{opacity:.85;transform:none}}
  @keyframes bootFade{0%,72%{opacity:1}100%{opacity:0;visibility:hidden}}
  body.hero #bootIntro{display:none!important}
  @media(prefers-reduced-motion: reduce){#bootIntro{display:none}}
</style>
<script>
  (function(){
    var el=document.getElementById('bootIntro');
    var h=location.hash||"";
    // skip on chrome-free embeds, hero iframe, or if seen this session
    if(/^#?embed=/.test(h) || /^#?hero$/.test(h)) { el.style.display='none'; return; }
    try{ if(sessionStorage.getItem('kolob:booted')==='1'){ el.style.display='none'; return; } }catch(e){}
    try{ sessionStorage.setItem('kolob:booted','1'); }catch(e){}
    setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); },3000);
  })();
</script>

<script>
"use strict";
// On ArtBlocks, tokenData is injected per token. Off-platform we default to a
// fixed canonical hash so the galaxy is stable and matches the website index.
var tokenData=(typeof tokenData!=="undefined")?tokenData:
  {hash:"0x4b4f4c42a17f0c3e9d5b8e2160f47a93c8d1e0b6452f9a3c7e1d80b54f2a69c3"};
function hashSeed(h){var s=0;
  for(var i=2;i<h.length;i++) s=(Math.imul(s,16)+parseInt(h[i],16)+1)|0;
  return s>>>0;}
function PRNG(seed){
  var a=seed^0x9e3779b9,b=seed^0x243f6a88,c=seed^0xb7e15162,d=1;
  return function(){a|=0;b|=0;c|=0;d|=0;
    var t=(a+b|0)+d|0;d=d+1|0;
    a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);c=c+t|0;
    return (t>>>0)/4294967296;};}
var TAU=6.28318530718;
function mk(seed){var r=PRNG(seed>>>0);

   case 1:                              // a pair of eccentric comets
     for(var i=0;i<2;i++) sys.comets.push({a:r.rng(1.3,1.9),e:r.rng(0.78,0.94),

// Orbit
function kepler(M,e){M=M%TAU;var E=M;
  for(var i=0;i<5;i++) E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
  return E;}
function orbit(a,e,peri,inc,M){
  var E=kepler(M,e);
  var ox=a*(Math.cos(E)-e),oy=a*Math.sqrt(1-e*e)*Math.sin(E);
  var px=ox*Math.cos(peri)-oy*Math.sin(peri);
  var py=ox*Math.sin(peri)+oy*Math.cos(peri);
  return [px,py*Math.cos(inc),py*Math.sin(inc)];}

function buildSlideshowQueue(){
  slideshowQueue=[];
  var r2=mk(hashSeed(tokenData.hash)*7+131),visited={};
  for(var si=0;si<12;si++){var ti;do{ti=r2.int(0,128);}while(visited[ti]);visited[ti]=true;
    slideshowQueue.push({node:ti,type:'throne'});}
  var widths=[0.4,0.65,0.85,1.1,0.55];
  for(si=0;si<5;si++) slideshowQueue.push({node:-1,type:'galaxy',w:widths[si]});
  if($ssQueue) $ssQueue.textContent=slideshowQueue.length+' targets loaded';
}
function nextSlideshowTarget(){
  if(!slideshowQueue.length) buildSlideshowQueue();
  var tgt=slideshowQueue[slideshowPhase%slideshowQueue.length];
  slideshowPhase=(slideshowPhase+1)%slideshowQueue.length;
  // set target camera
  if(tgt.type==='galaxy'){
    ssTargetNode=-1;
    ssTargetZoom=tgt.w||1;
    ssTargetAz=PRNG(hashSeed(tokenData.hash)+slideshowPhase*997)()*TAU;
    ssTargetTilt=0.3+0.4*Math.random();
  } else {
    ssTargetNode=tgt.node;
    ssTargetZoom=2.5+Math.random()*2.5;
    ssTargetAz=tgt.a!==undefined?tgt.a:0;
    ssTargetTilt=0.35+0.3*Math.random();
  }
  // capture the easing start pose + take the shortest rotation to the target
  ssFromAz=az; ssFromTilt=tilt; ssFromZoom=zoom; ssTransT=0;
  var daz=ssTargetAz-ssFromAz; ssTargetAz=ssFromAz+Math.atan2(Math.sin(daz),Math.cos(daz));
  slideshowPhaseT=0;
  if($ssQueue) $ssQueue.textContent=slideshowQueue.length>0
    ? 'q: '+slideshowPhase+'/'+slideshowQueue.length
    : 'queue empty';
}

function startSlideshow(){
  slideshowActive=true;

function applyRelics(sys,tier,r){
  if(tier===0) sys.scheme=[[255,206,120],[255,168,86]];        // celestial, gold palette
  else if(tier===1) sys.scheme=[[255,128,150],[255,96,120]];   // terrestrial, warm palette
  if(tier<=1 && sys.planets.length){                            // signature ringed giant
    var g=sys.planets[Math.min(1,sys.planets.length-1)];
    g.type=1; g.ring=true; g.szMul*=1.5;
  }
  if(tier===0){                                                 // binary companion + comet swarm
    if(sys.stars.length<2){var s2=Math.min(6,sys.stars[0].cls+1);
      sys.stars.push({cls:s2}); sys.binary=true; sys.sep=0.12; sys.binRev=10;
      var mm=STAR[sys.stars[0].cls].rad+STAR[s2].rad;
      sys.stars[0].off=sys.sep*STAR[s2].rad/mm; sys.stars[1].off=-sys.sep*STAR[sys.stars[0].cls].rad/mm;}
    for(var i=0;i<10;i++) sys.comets.push({a:r.rng(1.1,2.1),e:r.rng(0.6,0.92),
      peri:r()*TAU,inc:r.g()*0.5,rev:r.pick([3,4,5]),M0:r()*TAU});

}

// veil cinematic state
var veilActive=false,veilT=0,veilNode=-1,veilDidAdvance=false,veilSpin=0,veilNz=0;
var veilFrom=[110,215,255],veilTo=[255,110,210],veilPts=[],warpStars=[];
// Ceremonial veil: slow passage through dust, total darkness, palette-shift emergence
var VEIL_DUR=IS_MOBILE?640:760;                 // ~10.7–12.7s, 50% slower by design
function buildVeil(){
  var nP=IS_MOBILE?2400:5200,nW=IS_MOBILE?500:1100,r=mk((curNode*2654435761+777)>>>0),i;
  // dust particles in polar coords: drift inward then outward
  veilPts=[];
  for(i=0;i<nP;i++) veilPts.push({
    a:r()*TAU, r0:0.04+r()*1.10, sp:0.35+r()*1.05,
    sw:r()*TAU, sz:0.6+r()*1.6, bri:0.45+r()*0.55});
  // veil-membrane curtain threads
  warpStars=[];
  for(i=0;i<nW;i++) warpStars.push({
    a:r()*TAU, z:r(), ph:r()*TAU, bri:0.4+r()*0.6});
}
function renderVeil(){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  var t=veilT,cx=CX,cy=CY,i,minD=Math.min(W,H);
  // phase weights, withdrawal · veil · darkness · emergence
  var withW=Math.max(0,1-t/0.25);
  var memW =Math.max(0,Math.min(1,(t-0.18)/0.18))*Math.max(0,1-(t-0.46)/0.10);
  var darkW=Math.max(0,Math.min(1,(t-0.42)/0.06))*Math.max(0,1-(t-0.55)/0.06);
  var emrgW=Math.max(0,Math.min(1,(t-0.55)/0.22));
  // ── dust cloud: drifts inward then re-expands outward, slow ──
  ctx.globalCompositeOperation='lighter';
  var dotSz=Math.max(1,Math.round(minD/520))*dpr;
  for(i=0;i<veilPts.length;i++){var p=veilPts[i];
    var phase=t<0.5?-p.sp*t*0.75:p.sp*(t-0.5)*0.85;
    var rad=Math.max(0.02,p.r0+phase);
    var ang=p.a+Math.sin(t*1.6+p.sw)*0.14+(t<0.5?-t*0.55:(t-0.5)*0.55);
    var x=cx+Math.cos(ang)*rad*minD*0.55, y=cy+Math.sin(ang)*rad*minD*0.55;
    var dustA=(withW*0.45+emrgW*0.65)*p.bri*(1-darkW);     // suppressed during black
    if(dustA<0.02)continue;
    var srcCol=t<0.5?veilFrom:veilTo;
    var dCol=mix([170,170,195],srcCol,t<0.5?0.30:0.62);
    ctx.fillStyle='rgba('+(dCol[0]|0)+','+(dCol[1]|0)+','+(dCol[2]|0)+','+dustA.toFixed(2)+')';
    ctx.fillRect(x|0,y|0,p.sz*dotSz|0,p.sz*dotSz|0);}
  // ── veil membrane: shimmering thin curtain ──
  if(memW>0.05){var vR=minD*(0.20+0.04*Math.sin(t*3.5));
    for(i=0;i<warpStars.length;i++){var s=warpStars[i];
      var ang=s.a+t*0.25+Math.sin(t*1.3+s.ph)*0.04;
      var r1=vR*(0.85+0.32*s.z+0.04*Math.sin(t*7+s.ph));
      var x=cx+Math.cos(ang)*r1, y=cy+Math.sin(ang)*r1;
      var shim=0.5+0.5*Math.sin(t*11+s.ph);
      var a=memW*0.55*s.bri*shim*(1-darkW);
      if(a<0.02)continue;
      ctx.fillStyle='rgba(248,248,255,'+a.toFixed(2)+')';
      ctx.fillRect(x|0,y|0,1,1);}}
  // ── total darkness: pure black, single threshold pulse at midpoint ──
  if(darkW>0){
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='rgba(0,0,0,'+darkW.toFixed(2)+')';ctx.fillRect(0,0,W,H);
    if(t>0.475&&t<0.525){var pul=Math.sin((t-0.475)/0.05*Math.PI);
      var pr=minD*0.05*pul;
      ctx.fillStyle='rgba(255,255,255,'+(0.18*pul).toFixed(2)+')';
      ctx.beginPath();ctx.arc(cx,cy,pr,0,TAU);ctx.fill();}}
  // ── emergence: new palette blooms from centre outward ──
  if(emrgW>0.04){
    ctx.globalCompositeOperation='lighter';
    var bR=minD*0.65*emrgW;
    var g=ctx.createRadialGradient(cx,cy,0,cx,cy,bR);
    g.addColorStop(0,'rgba('+(veilTo[0]|0)+','+(veilTo[1]|0)+','+(veilTo[2]|0)+','+(0.30*emrgW).toFixed(2)+')');
    g.addColorStop(1,'rgba('+(veilTo[0]|0)+','+(veilTo[1]|0)+','+(veilTo[2]|0)+',0)');
    ctx.fillStyle=g;ctx.fillRect(cx-bR,cy-bR,bR*2,bR*2);}
  ctx.globalCompositeOperation='source-over';
  // gentle global fades at the very edges
  if(t<0.04){ctx.fillStyle='rgba(0,0,0,'+(1-t/0.04).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
  else if(t>0.93){ctx.fillStyle='rgba(0,0,0,'+((t-0.93)/0.07).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
}

  if(now-lastTap<dblTapDelay){
    if(cinematic){toggleCinematicUI(!cinematicUI);lastTap=0;return;}
    goGalaxy();lastTap=0;return;}
  lastTap=now;
  if(mode==="galaxy"){
    var mx=clientX*dpr,my=clientY*dpr;
    var bs=PX*(IS_MOBILE?48:30),fhit=-1;
    for(var i2=0;i2<FIXED.length;i2++){
      var fd=Math.abs(FIXED[i2].sx-mx)+Math.abs(FIXED[i2].sy-my);
      if(fd<bs){bs=fd;fhit=i2;}}
    if(fhit>=0){ if(FIXED[fhit].great) goStar(fhit); else goCore(fhit-3); return; }
    var bd=PX*(IS_MOBILE?28:16),hit=-1;
    for(var i=0;i<NODES.length;i++){
      var d=Math.abs(NODES[i].sx-mx)+Math.abs(NODES[i].sy-my);
      if(d<bd){bd=d;hit=i;}}
    if(hit>=0){goSystem(hit);return;}
  }
}

// ── Pointer events: handle mouse / stylus only. Touch is handled below
//    via TouchEvent for cross-browser multi-touch reliability (esp. iOS Safari).
cv.addEventListener('pointerdown',function(e){
  if(e.pointerType==='touch') return;                  // touch handler owns these
  if(cinematic){ exitCinematic(); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  drag=true;moved=0;lx=e.clientX;ly=e.clientY;pinching=false;
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerType==='touch') return;
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag){
    var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);
    az+=dx*0.006;tilt=Math.max(0.12,Math.min(1,tilt+dy*0.004));
    lx=e.clientX;ly=e.clientY;
  }else if(mode==="galaxy"){hover=-1;
    var mx=e.clientX*dpr,my=e.clientY*dpr,bd=PX*16;
    for(var i=0;i<NODES.length;i++){
      var d=Math.abs(NODES[i].sx-mx)+Math.abs(NODES[i].sy-my);
      if(d<bd){bd=d;hover=i;}}
    hoverStar=-1;var bs=PX*26;
    for(var hs=0;hs<15;hs++){var hfx=FIXED[hs];
      var hd=Math.abs(hfx.sx-mx)+Math.abs(hfx.sy-my);
      if(hd<bs){bs=hd;hoverStar=hs;}}
  }
});
cv.addEventListener('pointerup',function(e){
  if(e.pointerType==='touch') return;
  ptrs.delete(e.pointerId);
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  drag=false;
  if(moved<12) tapAt(e.clientX,e.clientY);
});
cv.addEventListener('pointercancel',function(e){
  if(e.pointerType==='touch') return;
  ptrs.delete(e.pointerId);drag=false;
});

// ── Touch events: authoritative for finger input. e.touches always reflects
//    every finger currently on screen, which avoids the pointer-capture quirks
//    iOS Safari has with two-finger gestures.
function syncFromTouches(touches){
  ptrs.clear();
  for(var i=0;i<touches.length;i++){var t=touches[i];
    ptrs.set(t.identifier,{x:t.clientX,y:t.clientY});}
}
cv.addEventListener('touchstart',function(e){
  e.preventDefault();
  if(cinematic){ exitCinematic(); return; }
  syncFromTouches(e.touches);
  if(e.touches.length===1){
    drag=true;moved=0;pinching=false;
    lx=e.touches[0].clientX;ly=e.touches[0].clientY;
  }else if(e.touches.length>=2){
    drag=false;pinching=true;
    var t1=e.touches[0],t2=e.touches[1];
    var dx=t2.clientX-t1.clientX,dy=t2.clientY-t1.clientY;
    pinchDist=Math.hypot(dx,dy);pinchAng=Math.atan2(dy,dx);
  }
},{passive:false});
cv.addEventListener('touchmove',function(e){
  e.preventDefault();
  syncFromTouches(e.touches);
  if(pinching && e.touches.length>=2){
    var t1=e.touches[0],t2=e.touches[1];
    var dx=t2.clientX-t1.clientX,dy=t2.clientY-t1.clientY;
    var nd=Math.hypot(dx,dy),na=Math.atan2(dy,dx);
    if(nd>0 && pinchDist>0){zoom*=nd/pinchDist; zoom=Math.max(0.3,Math.min(9,zoom));}
    var rot=na-pinchAng;
    if(rot>Math.PI)rot-=2*Math.PI; if(rot<-Math.PI)rot+=2*Math.PI;
    if(Math.abs(rot)>0.001) az+=rot*0.5;
    pinchDist=nd; pinchAng=na; moved+=20;
  }else if(drag && e.touches.length>=1){
    var t=e.touches[0];
    var dx=t.clientX-lx,dy=t.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);
    az+=dx*0.006; tilt=Math.max(0.12,Math.min(1,tilt+dy*0.004));
    lx=t.clientX;ly=t.clientY;
  }
},{passive:false});
cv.addEventListener('touchend',function(e){
  e.preventDefault();
  syncFromTouches(e.touches);
  if(e.touches.length===1){              // one finger lifted from a pinch, resume single-finger drag
    var t=e.touches[0]; drag=true;pinching=false;lx=t.clientX;ly=t.clientY;return;
  }
  if(e.touches.length===0){drag=false;pinching=false;
    if(moved<12 && e.changedTouches.length>0){
      var ct=e.changedTouches[0]; tapAt(ct.clientX,ct.clientY);
    }
  }
},{passive:false});
cv.addEventListener('touchcancel',function(e){
  syncFromTouches(e.touches);
  if(e.touches.length<2) pinching=false;
  if(e.touches.length===0) drag=false;
});

// Keyboard
addEventListener('keydown',function(e){var k=e.key.toLowerCase();
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(cinematic){ exitCinematic(); return; }   // any key ends the cinematic
  if(k==="escape"||(k==="g"&&mode!=="galaxy")){if(cinematic)exitCinematic();goGalaxy();keySel=-1;}
  else if(k===" "){e.preventDefault();paused=!paused;}
  else if(k==="h"){hud=!hud;}
  else if(k==="]"){_dspd=Math.min(4,_dspd*1.5);}
  else if(k==="["){_dspd=Math.max(0.005,_dspd/1.5);}
  // ←/→ step through thrones · ↑/↓ orbit around the galaxy
  else if(k==="arrowleft"||k==="arrowright"){
    var step=(k==="arrowright")?1:-1;
    keySel=(keySel<0)?0:Math.max(0,Math.min(128,keySel+step));
    hover=keySel;keyHeld=true;e.preventDefault();   // same state as mouse hover
  }
  else if(k==="arrowup"||k==="arrowdown"){
    az+=(k==="arrowup")?-0.18:0.18;
    e.preventDefault();
  }
  // 1-9, camera presets (0 resets)
  else if(k>="1"&&k<="9"){
    var cam=parseInt(k)-1;
    var prs=[
      {z:0.95,a:0.00,t:0.62},{z:0.85,a:0.62,t:0.55},{z:1.05,a:1.22,t:0.60},
      {z:0.75,a:1.85,t:0.50},{z:1.10,a:2.45,t:0.60},{z:0.80,a:3.10,t:0.52},
      {z:1.00,a:3.75,t:0.58},{z:0.88,a:4.30,t:0.55},{z:0.92,a:5.00,t:0.60}];
    zoom=prs[cam].z;az=prs[cam].a;tilt=prs[cam].t;
    if(mode!=="galaxy")goGalaxy();keySel=-1;
    e.preventDefault();
  }
  else if(k==="0"){zoom=1;az=0;tilt=0.52;keySel=-1;}
  else if(k==="c"){if(cinematic){exitCinematic();stopSlideshow();keySel=-1;}
    else{stopSlideshow();enterCinematic();}}
  else if(k==="s"){var a=document.createElement('a');
    a.download="kolob_"+(mode==="system"?"throne"+curNode:"chart")+".png";
    a.href=cv.toDataURL('image/png');a.click();}
  else if(k==="enter"&&keySel>=0&&mode==="galaxy"){goSystem(keySel);}
  else if(k==='f'){toggleFs();}
  else if(k==='m'){_monoV=!_monoV;cv.style.filter=_monoV?'grayscale(1) contrast(1.12)':'';}
  else if(k==='k'||k==='?'){toggleKeymap();}
  // palette lock, cool palette only
});

// M, pure white-on-black lens · K, the key of shortcuts
var _monoV=false,_kmapEl=null;
function toggleKeymap(){

      '<b style="color:#fff">↑ ↓</b> &nbsp;orbit the galaxy<br>'+
      '<b style="color:#fff">1–9 / 0</b> camera presets / reset<br>'+
      '<b style="color:#fff">Space</b> pause<br>'+
      '<b style="color:#fff">[ ]</b> &nbsp;display speed<br>'+
      '<b style="color:#fff">C</b> &nbsp;cinematic slideshow<br>'+
      '<b style="color:#fff">H</b> &nbsp;hud<br>'+
      '<b style="color:#fff">M</b> &nbsp;monochrome<br>'+
      '<b style="color:#fff">S</b> &nbsp;save a still<br>'+
      '<b style="color:#fff">F</b> &nbsp;fullscreen<br>'+
      '<b style="color:#fff">K</b> &nbsp;close this key';
    document.body.appendChild(_kmapEl);
  } else _kmapEl.style.display=(_kmapEl.style.display==='none')?'block':'none';}

// Render primitives
function project(x,y,z,cosP,sinP,scale){
  var rx=x*cosP-y*sinP,ry=x*sinP+y*cosP;
  return [CX+rx*scale,CY+ry*scale*tilt-z*scale*(1-tilt),ry];}
function rot3(v,ay,ax){
  var cy=Math.cos(ay),sy=Math.sin(ay),cx=Math.cos(ax),sx=Math.sin(ax);
  var x=v[0]*cy+v[2]*sy,z=-v[0]*sy+v[2]*cy;
  return [x,v[1]*cx-z*sx,v[1]*sx+z*cx];}
function plot(sx,sy,col){
  var gx=sx/PX|0,gy=sy/PX|0;
  if(gx<0||gy<0||gx>=GW||gy>=GH) return;
  ctx.fillStyle=col;ctx.fillRect(gx*PX,gy*PX,PX,PX);}
function body(sx,sy,r,base,rot){cluster(sx,sy,r,base,ccount(r,PX),rot,PX,plot);}
function starBody(sx,sy,r,base,rot){
  for(var q=0;q<24;q++){var ag=q/24*TAU+rot*1.4,rr=r*(1.18+(q%3)*0.26);
    plot(sx+Math.cos(ag)*rr,sy+Math.sin(ag)*rr,rs(sh(base,0.25)));}
  cluster(sx,sy,r,lt(base,0.12),ccount(r,PX),rot,PX,plot);
  cluster(sx,sy,r*0.38,lt(P.c3,0.3),ccount(r*0.38,PX),rot,PX,plot);}
function streak(x0,y0,x1,y1,col){
  var n=Math.max(2,(Math.abs(x1-x0)+Math.abs(y1-y0))/PX|0);
  for(var i=0;i<=n;i++) plot(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n,col);}

// GALAXY VIEW
var GALLOOP=24000;
var sX=new Float32Array(N),sY=new Float32Array(N),vis=new Uint8Array(N);

function renderGalaxy(){
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
  if(!window.sX||!window.sY||!window.vis||!window.GALLOOP){
    if(!window.sX) window.sX=new Float32Array(N);
    if(!window.sY) window.sY=new Float32Array(N);
    if(!window.vis) window.vis=new Uint8Array(N);
    if(!window.GALLOOP) window.GALLOOP=24000;
  }
  var t=(clock%GALLOOP)/GALLOOP;
  var phi=t*TAU+az,cosP=Math.cos(phi),sinP=Math.sin(phi);
  var scale=scaleRef*zoom;
  dens.fill(0);
  for(var i=0;i<gN;i++){
    var ang=gA[i]+gRev[i]*TAU*t;   // counter-clockwise
    var sp=project(gR[i]*Math.cos(ang),gR[i]*Math.sin(ang),gZ[i],cosP,sinP,scale);
    window.sX[i]=sp[0];window.sY[i]=sp[1];
    var gx=sp[0]/PX|0,gy=sp[1]/PX|0;
    if(gx>=0&&gy>=0&&gx<GW&&gy<GH){dens[gy*GW+gx]++;window.vis[i]=1;}else window.vis[i]=0;
  }
  for(i=0;i<gN;i++){var kk=i%GAL_COLS.length,lv=0;
    if(gR[i]<0.07)kk=0;else if(gR[i]<0.20)kk=1;else if(gR[i]<0.27)kk=2;else if(gR[i]<0.50)kk=3;else kk=4;
    lv=kk<2?3:kk<4?2:1;
    if(i%7===0)lv=Math.min(4,lv+1);
    var rev=gRev[i];
    for(var s=Math.min(3,rev+1);s>=1;s--){var L=lv-s;if(L<0)continue;
      var a2=gA[i]+rev*TAU*(t-s*0.010);
      var sp=project(gR[i]*Math.cos(a2),gR[i]*Math.sin(a2),gZ[i],cosP,sinP,scale);
      plot(sp[0],sp[1],GAL_COLS[kk][L][0]);}
  }
  for(i=0;i<gN;i++){if(!window.vis[i])continue;
    var c=dens[(sY[i]/PX|0)*GW+(sX[i]/PX|0)];
    var D=c>=9?3:c>=5?2:c>=2?1:0;
    var kk2=i%GAL_COLS.length;
    if(gR[i]<0.07)kk2=0;else if(gR[i]<0.20)kk2=1;else if(gR[i]<0.27)kk2=2;else if(gR[i]<0.50)kk2=3;else kk2=4;
    plot(window.sX[i],window.sY[i],GAL_COLS[kk2][kk2<2?3:kk2<4?2:1][D]);}

  // Veils, two thin white particle barriers (denser + vertical spread)
  var veilSeeds=[12345,67890];
  for(var v=0;v<2;v++){var vr=v?0.30:0.56,vs=veilSeeds[v];   // pushed outward to clear the larger KOLOB well
    // Layer A: dense inner band
    for(i=0;i<480;i++){var a=i/480*TAU+(v?clock*0.0005:-clock*0.0004);
      var rr=vr+(Math.sin(a*13+vs)*0.003+Math.sin(a*23+vs+clock*0.002)*0.002);
      // vertical spread: 3 z-planes per band for thicker veil
      var zV=[0.010*1.5,-0.010*1.5,0.025999]; // ±0.015 mid + ±0.025 outer
      var spA=project(rr*Math.cos(a),rr*Math.sin(a),zV[i%3],cosP,sinP,scale);
      var shim=0.6+0.4*Math.sin(i*0.7+clock*0.015+vs);
      var densV=0.55+0.45*Math.sin(a*4+vs);
      if(densV<0.25)continue;
      var alpha=(0.28+0.55*shim*densV*(0.7+0.3*Math.sin(a*8+clock*0.003+vs))).toFixed(2);
      var distFactor=1-Math.abs(rr-vr)*60;
      if(distFactor<0.1)continue;
      plot(spA[0],spA[1],"rgba("+(200+55*shim|0)+","+(210+45*shim|0)+","+(230+25*shim|0)+","+alpha+")");}
    // Layer B: outer shimmering halo
    for(i=0;i<240;i++){var a=i/240*TAU-(v?clock*0.0003:clock*0.0002);
      var rr=vr*0.98+Math.sin(a*17+vs*2)*0.002;
      var zV2=(i%2===0)?0.020:-0.020;
      var sp=project(rr*Math.cos(a),rr*Math.sin(a),zV2,cosP,sinP,scale);
      var shim=0.5+0.5*Math.sin(i*1.1+clock*0.02+vs+7);
      plot(sp[0],sp[1],"rgba(230,235,245,"+(0.15+0.2*shim).toFixed(2)+")");}
  }

  // TELESTIAL, extra drifting detail in the galaxy's outer ring
  for(i=0;i<800;i++){
    var tr=0.74+0.34*((i*0.61803399)%1);
    var ta=i*2.39996 + t*TAU*(0.45+tr*0.5) + 0.3*Math.sin(clock*0.01+i);
    var tz=0.05*Math.sin(i*1.7+clock*0.008);
    var tsp=project(tr*Math.cos(ta),tr*Math.sin(ta),tz,cosP,sinP,scale);
    var tw=0.4+0.6*Math.sin(i*0.9+clock*0.02);
    plot(tsp[0],tsp[1],rs(sh(mix(P.c0,TIER_COL[2],0.55),0.28+0.42*tw)));
  }
  // OUTER DARKNESS, churning dark matter banished beyond the galaxy
  for(i=0;i<WORMS.length;i++){var w=WORMS[i];
    var wr=w.r+0.06*Math.sin(clock*0.02+w.ph);
    var wa=w.a+0.05*Math.sin(clock*0.013+w.ph)+t*TAU*0.30;
    for(var ws=0;ws<5;ws++){
      var wsp=project((wr+ws*0.020)*Math.cos(wa-ws*0.05),
                      (wr+ws*0.020)*Math.sin(wa-ws*0.05),0,cosP,sinP,scale);
      var fk=Math.sin(w.ph*7+clock*0.03+ws);
      var dk=fk>0.93?44:fk<-0.97?16:6;
      plot(wsp[0],wsp[1],"rgb("+dk+","+dk+","+(dk+5)+")");
    }
  }

  // KOLOB axis-mundi: small clean black disc (SHAPE-style mark) nestled inside the triangle,
  // with Kolob itself as a tight 10-dot decagon of white particles at the very centre.
  var bh=Math.max(PX*12,scale*0.108);                  // halved, sits well within the triangle
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.arc(CX,CY,bh,0,TAU);ctx.fill();
  for(i=0;i<140;i++){var p=CTPL[i%CTPL.length];        // soft particle texture inside the well
    plot(CX+p[0]*bh*0.96,CY+p[1]*bh*0.96,"rgb(2,2,5)");}
  for(i=0;i<160;i++){var aa=i/160*TAU+clock*0.06;      // accretion disc glow, hugs the rim
    var rr2=bh*(1.08+(i%5)*0.06);
    plot(CX+Math.cos(aa)*rr2,CY+Math.sin(aa)*rr2*tilt,rs(mix(P.c2,P.c3,(i%5)/5)));}
  // Kolob: a very tight cluster of 12 white dots (regular dodecagon), slow rotation
  var decR=Math.max(PX*1,bh*0.09),decSpin=clock*0.012;
  for(i=0;i<12;i++){var ka=i*TAU/12-Math.PI/2+decSpin;
    plot(CX+Math.cos(ka)*decR,CY+Math.sin(ka)*decR,"rgb(255,255,255)");}

  // 15 fixed stars, great 3 = equilateral triangle · core 12 = icosahedron
  var fp=[];
  var icoAy=clock*0.0009, icoAx=clock*0.0006;
  for(i=0;i<15;i++){var fx=FIXED[i];
    var sp;
    if(fx.great){
      var fa=fx.a+fx.rev*t*TAU;          // rigid rotation → stays equilateral
      sp=project(fx.r*Math.cos(fa),fx.r*Math.sin(fa),0,cosP,sinP,scale);
      fp.push(sp);
    }else{
      var rv=rot3(fx.ico,icoAy,icoAx);   // core 12 spin as one 3D solid
      sp=project(rv[0]*fx.icoR,rv[1]*fx.icoR,rv[2]*fx.icoR,cosP,sinP,scale);
    }
    fx.sx=sp[0]; fx.sy=sp[1];
    var pul=0.85+0.15*Math.sin(clock*0.03+fx.ph);
    var fsz=(fx.great?PX*5.0:PX*3.6)*pul;
    for(var gq=0;gq<16;gq++){            // always-on glow halo → prominent landmark
      var ga=clock*0.025+gq/16*TAU;
      plot(sp[0]+Math.cos(ga)*fsz*1.7,sp[1]+Math.sin(ga)*fsz*1.7,rs(sh(fx.col,0.42)));}
    if(i===hoverStar){                   // hover cue
      for(var hq=0;hq<22;hq++){var ha=clock*0.05+hq/22*TAU;
        plot(sp[0]+Math.cos(ha)*fsz*2.5,sp[1]+Math.sin(ha)*fsz*2.5,"rgba(255,255,255,0.75)");}}
    starBody(sp[0],sp[1],fsz,fx.col,clock*0.02);}
  for(i=0;i<3;i++){var j=(i+1)%3;
    streak(fp[i][0],fp[i][1],fp[j][0],fp[j][1],
      rs(sh(P.accent,0.4+0.3*Math.sin(clock*0.05+i))));}

  // 100 thrones with tier-colored halos
  for(i=0;i<NODES.length;i++){var nd=NODES[i];
    var ang=nd.a+nd.rev*TAU*t;     // thrones orbit counter-clockwise
    var sp=project(nd.r*Math.cos(ang),nd.r*Math.sin(ang),nd.z,cosP,sinP,scale);
    nd.sx=sp[0];nd.sy=sp[1];
    var col=STAR[nd.star].col,gr=PX*(i===hover?3.4:i===keySel?2.8:2.4);
    var tc=TIER_COL[tierOf(i)];
    var bcol=mix(col,tc,0.6);            // tier-tinted body, cores still read white
    if(i===hover || i===keySel){
      var glowR=gr*(i===keySel?2.0:2.2);
      for(var q=0;q<12;q++){var a4=clock*0.02+q/12*TAU;
        plot(sp[0]+Math.cos(a4)*glowR,sp[1]+Math.sin(a4)*glowR,
          "rgba("+tc[0]+","+tc[1]+","+tc[2]+",0.42)");}}
    body(sp[0],sp[1],gr,bcol,nd.spin+clock*0.013);
  }

  // witness flares — a mint or advance in another tab lights the galaxy here
  if(FLARES.length){
    var nowF=performance.now();
    for(i=FLARES.length-1;i>=0;i--){var fl=FLARES[i],lf2=(nowF-fl.t0)/2600;
      if(lf2>=1){FLARES.splice(i,1);continue;}
      var nd2=NODES[fl.i]; if(!nd2)continue;
      var fa=1-lf2, fr=PX*(4+lf2*26);
      ctx.strokeStyle='rgba('+fl.col[0]+','+fl.col[1]+','+fl.col[2]+','+(fa*0.7).toFixed(2)+')';
      ctx.lineWidth=Math.max(1,PX*0.8*fa);

function clusterE(sx,sy,r,base,count,rot){var c=Math.cos(rot),s=Math.sin(rot);

    var b=dx*-0.45+dy*-0.5+p[2]*0.74;

function bodyE(sx,sy,r,base,rot){var px=Math.max(0.5,PLANPX*dpr);clusterE(sx,sy,r,base,ccountE(r,px),rot);}
/* textured planet surfaces (gas bands / rocky mottle / ice / hot swirl) */
var SHADE_L=14,SURF_L=6;

    lut[li]=row;}return lut;}
function planetBody(sx,sy,r,base,acc,spin,style,bands,nseed){
  var lut=texLut(base,acc),count=ccountE(r,Math.max(0.5,PLANPX*dpr));
  var cs=Math.cos(spin),sn=Math.sin(spin);

    var b=vx*-0.45+vy*-0.5+vz*0.74;var f2=(b+1.0)/2.0;if(f2<0)f2=0;if(f2>1)f2=1;

/* build-time passes */
function respaceE(sys){

  var r=mk(sys.seed^0xDE4517),i,k,out;

// Great 3 → kolob-sun1b surface-emission engine, three LOCKED identities.

// noise field (after kolob-sun1b)
function hash3(x,y,z){var n=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,1274126177))|0;
  n=(n^(n>>>13))|0;n=Math.imul(n,1274126177)|0;return((n^(n>>>16))>>>0)/4294967296;}
function vnoise(x,y,z){var xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),
  xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  function L(a,b,k){return a+(b-a)*k;}
  return L(L(L(hash3(xi,yi,zi),hash3(xi+1,yi,zi),u),L(hash3(xi,yi+1,zi),hash3(xi+1,yi+1,zi),u),v),
           L(L(hash3(xi,yi,zi+1),hash3(xi+1,yi,zi+1),u),L(hash3(xi,yi+1,zi+1),hash3(xi+1,yi+1,zi+1),u),v),w);}
function fbm(x,y,z){var s=0,a=0.5,f=1;for(var o=0;o<3;o++){s+=a*vnoise(x*f,y*f,z*f);f*=2.03;a*=0.5;}return s;}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function norm(v){var l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}

// ── Core-12 mini particle sun, the great-star engine, scaled & simplified ──
var _csData=null,_csSeed=null;
function buildCoreStar(seed){
  var r=mk(seed>>>0),arr=[],i,nS=IS_MOBILE?170:(gpuMode?520:340);
  for(i=0;i<nS;i++){
    var u=r()*TAU,ct=2*r()-1,st=Math.sqrt(1-ct*ct);
    var d=[st*Math.cos(u),st*Math.sin(u),ct];
    var up=Math.abs(d[1])<0.92?[0,1,0]:[1,0,0];
    var t1=norm(cross(d,up)),t2=cross(d,t1);
    var erupt=r()<0.17;
    arr.push({d:d,t1:t1,t2:t2,ph:r()*40,tipExt:erupt?(0.8+r()*1.0):(0.2+r()*0.35),
      amp:0.6+r()*0.9,coil:2.0+r()*3.0,flow:0.2+r()*0.5,bri:0.6+r()*0.6});
  }
  return arr;
}
function renderCoreStar(cx,cy,rad,seed,col){
  if(_csSeed!==seed){_csData=buildCoreStar(seed);_csSeed=seed;}
  var arr=_csData,t=clock*0.013;
  var spin=az+clock*0.011,cosS=Math.cos(spin),sinS=Math.sin(spin);
  var cosT=Math.cos(tilt),sinT=Math.sin(tilt);
  var cr=col[0]|0,cg=col[1]|0,cb=col[2]|0;
  var NK=IS_MOBILE?14:(gpuMode?30:22),INV=1/(NK-1),i,k;
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<arr.length;i++){var sd=arr[i],tw=t*sd.flow+sd.ph;
    var bx=sd.d[0]*1.6,by=sd.d[1]*1.6,bz=sd.d[2]*1.6;
    for(k=0;k<NK;k++){
      var u=k*INV,f=u*u,amp=(0.10+f*0.7)*sd.amp;
      var na=fbm(bx+f*sd.coil+tw,by,bz)-0.44,nb=fbm(by,bz+f*sd.coil+tw,bx)-0.44;
      var rr=1.0+sd.tipExt*f+na*0.1;
      var px=sd.d[0]+sd.t1[0]*na*amp+sd.t2[0]*nb*amp;
      var py=sd.d[1]+sd.t1[1]*na*amp+sd.t2[1]*nb*amp;
      var pz=sd.d[2]+sd.t1[2]*na*amp+sd.t2[2]*nb*amp;
      var pl=Math.sqrt(px*px+py*py+pz*pz)||1;pl=rr/pl;px*=pl;py*=pl;pz*=pl;
      var rx=px*cosS-pz*sinS,rz=px*sinS+pz*cosS;

      ctx.fillStyle='rgba('+cr+','+cg+','+cb+','+a.toFixed(3)+')';
      ctx.fillRect(sx,sy,PX,PX);
    }
  }
  ctx.globalCompositeOperation='source-over';

function buildStar(seed){
  var r=mk(seed>>>0),i;sunStrands=[];sunOrbits=[];
  var nS=IS_MOBILE?1000:3600, nO=IS_MOBILE?150:400;
  for(i=0;i<nS;i++){                                  // strands rooted on the surface
    var u=r()*TAU,ct=2*r()-1,st=Math.sqrt(1-ct*ct);
    var d=[st*Math.cos(u),st*Math.sin(u),ct];
    var up=Math.abs(d[1])<0.92?[0,1,0]:[1,0,0];
    var t1=norm(cross(d,up)),t2=cross(d,t1);
    var erupt=r()<(0.14+SUN.big);                     // some erupt as long flares
    sunStrands.push({d:d,t1:t1,t2:t2,ph:r()*40,
      tipExt:erupt?(1.0+r()*1.2):(0.25+r()*0.4),
      amp:0.7+r()*1.1,coil:2.0+r()*3.0,flow:0.18+r()*0.5,bri:0.65+r()*0.6});
  }
  for(i=0;i<nO;i++){                                  // orbiting elements on tilted rings
    var nu=r()*TAU,nc=2*r()-1,nsr=Math.sqrt(1-nc*nc);
    var n=[nsr*Math.cos(nu),nsr*Math.sin(nu),nc];
    var nup=Math.abs(n[1])<0.92?[0,1,0]:[1,0,0];
    var ou=norm(cross(n,nup)),ov=cross(n,ou);
    sunOrbits.push({u:ou,v:ov,rad:1.12+r()*1.05,ph:r()*TAU,
      sp:(r()<0.5?-1:1)*(0.35+r()*1.0),bri:0.55+r()*0.6});

}
function sunProject(x,y,z,s){

// ── Creator-Mode authorship for the 3 great stars (writes to localStorage;
// on-chain this maps 1:1 to PMP fields col/length/rot/density/speed/curl/big/name) ──
// Each great star has a LOCKED hue band so no two great stars can ever converge
// to the same colour. The author tunes saturation & lightness within that band.

var STAR_NAMES_OVR={};                                  // {idx: "OverrideName"}
function _seKey(i){return "kolob:sun:"+i;}
function rgb2hsl(c){var r=c[0]/255,g=c[1]/255,b=c[2]/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h,s,l=(mx+mn)/2;
  if(mx===mn){h=s=0;} else { var d=mx-mn;
    s=l>0.5?d/(2-mx-mn):d/(mx+mn);
    switch(mx){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4;}
    h/=6;} return [h*360,s,l];}

function renderStar(){

    for(k=0;k<NK;k++){
      u=k*INV; f=u*u;
      amp=(0.10+f*0.85)*sd.amp*SUN.noise;
      na=fbm(sx+f*sd.coil*SUN.curl+tw,sy,sz)-0.44;
      nb=fbm(sy,sz+f*sd.coil*SUN.curl+tw,sx)-0.44;
      rr=1.0+sd.tipExt*f*SUN.length+na*0.10;
      px=sd.d[0]+sd.t1[0]*na*amp+sd.t2[0]*nb*amp;
      py=sd.d[1]+sd.t1[1]*na*amp+sd.t2[1]*nb*amp;
      pz=sd.d[2]+sd.t1[2]*na*amp+sd.t2[2]*nb*amp;
      pl=Math.sqrt(px*px+py*py+pz*pz)||1; pl=rr/pl; px*=pl;py*=pl;pz*=pl;
      rx=px*cosS-pz*sinS; rz=px*sinS+pz*cosS;
      sp=sunProject(rx,py,rz,s);
      a=sd.bri*(0.34-f*0.20)*intro; if(a<0.03)a=0.03; if(a>1)a=1;
      ctx.fillStyle='rgba('+(255*cr|0)+','+(255*cg|0)+','+(255*cb|0)+','+a.toFixed(3)+')';
      ctx.fillRect(sp[0],sp[1],DOT,DOT);
    }
  }
  for(i=0;i<aO;i++){var o=sunOrbits[i];                   // orbiting elements w/ trails
    for(k=0;k<3;k++){var th=o.ph+(t-k*0.045)*o.sp,cth=Math.cos(th),sth=Math.sin(th);
      px=(o.u[0]*cth+o.v[0]*sth)*o.rad;py=(o.u[1]*cth+o.v[1]*sth)*o.rad;pz=(o.u[2]*cth+o.v[2]*sth)*o.rad;
      sp=sunProject(px,py,pz,s);
      a=(k===0?0.62:k===1?0.30:0.15)*o.bri*intro; if(a>1)a=1;
      ctx.fillStyle='rgba('+(200+55*cr|0)+','+(200+55*cg|0)+','+(220+35*cb|0)+','+a.toFixed(3)+')';
      ctx.fillRect(sp[0],sp[1],k===0?DOT*1.6:DOT,k===0?DOT*1.6:DOT);
    }}
  ctx.globalCompositeOperation='source-over';
  $mintInfo.innerHTML="";
  if(hud){
    document.getElementById('hud').innerHTML=
     "<span class=\"throne\">"+starDisplayName(starIdx)+"</span>\n<span class=\"tier\">GREAT STAR</span>";
  }
}

// ── CORE-12: twelve LOCKED, never-alike extreme throne systems ───────────
function extremize(sys,r,ci){
  var i,m;
  for(i=0;i<sys.planets.length;i++){var pl=sys.planets[i];
    pl.szMul*=1.3+r()*0.7;pl.e=Math.min(0.5,pl.e+r()*0.18);}
  switch(ci){
   case 0:  // RINGED DYNASTY, every world ringed (and ring-wider)
     for(i=0;i<sys.planets.length;i++){sys.planets[i].ring=true;sys.planets[i].szMul*=1.4;} break;
   case 1:  // MOON SWARM, dramatic — every planet a swarm host
     for(i=0;i<sys.planets.length;i++){var p1=sys.planets[i],mr=[12,9,7,5,4,3,2],ad=r.int(8,14);
       for(m=0;m<ad;m++) p1.moons.push({a:0.05+p1.moons.length*0.026+r()*0.012,
         rev:mr[m%mr.length],M0:r()*TAU,peri:r()*TAU});} break;
   case 2:  // ASTEROID EMPIRE — vast belt
     sys.asteroids=[];for(i=0;i<5000;i++){var aa=r.rng(0.3,1.5);
       sys.asteroids.push({a:aa,e:r()*0.25,peri:r()*TAU,inc:r.g()*0.15,
         rev:Math.max(1,Math.round(Math.pow(aa,-1.5))),M0:r()*TAU});} break;
   case 3:  // COMET STORM — many active tails
     sys.comets=[];for(i=0;i<55;i++) sys.comets.push({a:r.rng(1.0,2.4),e:r.rng(0.6,0.95),
       peri:r()*TAU,inc:r.g()*0.6,rev:r.pick([3,4,5]),M0:r()*TAU}); break;
   case 4:  // EMBRYO NURSERY — clouds of glowing protoworlds
     sys.embryos=[];for(i=0;i<90;i++) sys.embryos.push({a:0.12+r()*0.9,rev:r.int(4,12),M0:r()*TAU,ph:r()*TAU}); break;
   case 5:  // ECCENTRIC CHAOS — wildly eccentric & tilted (preserved by enhancePiece skipping respace)
     for(i=0;i<sys.planets.length;i++){var p2=sys.planets[i];p2.e=0.45+r()*0.40;p2.inc=r()*0.85;}
     sys.kuiper=[];for(i=0;i<1100;i++){var ka=r.rng(1.1,1.9);
       sys.kuiper.push({a:ka,e:r()*0.4,peri:r()*TAU,inc:r.g()*0.3,
         rev:Math.max(1,Math.round(Math.pow(ka,-1.5))),M0:r()*TAU});} break;
   case 6:  // BINARY HEART, twin stars, near-circular circumbinary worlds
     if(sys.stars.length<2){sys.stars.push({cls:Math.min(6,sys.stars[0].cls+1)});}
     sys.binary=true;sys.sep=0.13;sys.binRev=12;
     var mm=STAR[sys.stars[0].cls].rad+STAR[sys.stars[1].cls].rad;
     sys.stars[0].off=sys.sep*STAR[sys.stars[1].cls].rad/mm;
     sys.stars[1].off=-sys.sep*STAR[sys.stars[0].cls].rad/mm;
     for(i=0;i<sys.planets.length;i++)sys.planets[i].e=Math.min(0.25,sys.planets[i].e); break;
   case 7:  // RESONANCE CATHEDRAL, many planets, tight low-e chain
     for(i=0;i<sys.planets.length;i++){sys.planets[i].e*=0.3;sys.planets[i].inc*=0.4;}
     if(sys.planets[0]){var b7=sys.planets[0].a,r7=sys.planets[0].rev;
       for(i=0;i<3;i++)sys.planets.push({a:b7*Math.pow(0.55,i+1),e:0.02,peri:r()*TAU,inc:0.02,
         rev:r7*(i+2),M0:r()*TAU,type:0,spin:r()*TAU,ring:false,szMul:0.8,moons:[]});} break;
   case 8:  // FROZEN KUIPER, vast icy outer realm
     sys.kuiper=[];for(i=0;i<3000;i++){var ka2=r.rng(1.05,1.78);
       sys.kuiper.push({a:ka2,e:r()*0.3,peri:r()*TAU,inc:r.g()*0.2,
         rev:Math.max(1,Math.round(Math.pow(ka2,-1.5))),M0:r()*TAU});} break;
   case 9:  // HOT-JUPITER FORGE, close-in giants, scorched worlds
     for(i=0;i<sys.planets.length;i++){var p3=sys.planets[i];
       if(p3.a<0.5){p3.type=1;p3.szMul*=1.6;p3.ring=r()<0.5;}else p3.type=3;} break;
   case 10: // MEGA-RING WORLD, one colossal ringed giant, sparse else
     sys.planets=sys.planets.slice(0,Math.min(3,sys.planets.length));
     if(sys.planets[0]){sys.planets[0].type=1;sys.planets[0].ring=true;sys.planets[0].szMul*=2.4;} break;
   case 11: // TROJAN SWARMS, co-orbital clouds at a host's L4/L5
     sys.asteroids=[];var host=sys.planets[Math.min(1,sys.planets.length-1)];
     if(host)for(i=0;i<2800;i++){var lead=r()<0.5;
       sys.asteroids.push({a:host.a*(1+r.g()*0.04),e:host.e+r()*0.03,peri:host.peri,inc:r.g()*0.05,
         rev:host.rev,M0:host.M0+(lead?1.047:-1.047)+r.g()*0.20});} break;
  }
  return sys;
}
// Core-12 grandeur pass, more planets (well-spaced), 2× belts, prominent comets
function coreBoost(sys,r){
  var orig=sys.planets,oc=orig.length,i;
  // target ~3× planets, but capped so every orbit keeps breathing room
  var N=Math.min(oc*3,IS_MOBILE?9:14);
  var aIn=0.14,aOut=1.0,ratio=N>1?Math.pow(aOut/aIn,1/(N-1)):1.3;
  while(ratio<1.16&&N>2){N--;ratio=Math.pow(aOut/aIn,1/(N-1));}  // min 1.16 gap = no orbit crossing
  var out=[],a=aIn,pl;
  for(i=0;i<N;i++){
    if(i<oc){pl=orig[i];}                                   // keep the original world (type/ring/moons)
    else{var src=orig[i%oc];pl={type:src.type,spin:r()*TAU,ring:(r()<0.35),
      szMul:src.szMul*(0.8+r()*0.5),moons:[]};}
    pl.a=a;
    pl.e=Math.min(pl.e||0,0.04);                            // low-e so apoapsis stays inside next periapsis
    pl.peri=r()*TAU;pl.inc=r()*0.20;
    if(pl.M0==null)pl.M0=r()*TAU;
    pl.rev=Math.max(1,Math.round(Math.pow(a,-1.5)*4));
    out.push(pl);a*=ratio;
  }
  sys.planets=out;
  if(!IS_MOBILE){                                           // 2× belts (desktop only, perf)
    var dup=function(arr,j){var n=arr.length,k;for(k=0;k<n;k++){var o=arr[k];
      arr.push({a:o.a*(1+(r()-0.5)*j),e:o.e,peri:o.peri+(r()-0.5)*0.2,inc:o.inc,rev:o.rev,M0:r()*TAU});}};
    dup(sys.asteroids,0.04);dup(sys.kuiper,0.04);}
  var nc=(IS_MOBILE?8:16)+r.int(0,8);                       // prominent eccentric comets, out beyond the planets
  for(i=0;i<nc;i++) sys.comets.push({a:r.rng(1.3,2.7),e:r.rng(0.7,0.95),
    peri:r()*TAU,inc:r.g()*0.5,rev:r.pick([2,3,4,5]),M0:r()*TAU});
  return sys;
}
function _ceKey(c){return "kolob:core:"+c;}
function loadCoreOverride(c){try{return JSON.parse(localStorage.getItem(_ceKey(c))||"null");}catch(e){return null;}}
// Build the system for core index ci, honouring any sealed archetype/name override
function applyCoreOverride(ci){
  var seed=CORE_SEEDS[3+ci],ovr=loadCoreOverride(ci);
  var arch=(ovr&&typeof ovr.archetype==='number')?Math.max(0,Math.min(11,ovr.archetype|0)):ci;
  system=buildSystem(seed,0);
  extremize(system,mk((seed^0xABCDEF)>>>0),arch);
  // Skip coreBoost for archetypes whose structure it would overwrite
  // (ECCENTRIC CHAOS / RESONANCE CATHEDRAL / MEGA-RING WORLD).
  if(arch!==5 && arch!==7 && arch!==10) coreBoost(system,mk((seed^0x5A17C0)>>>0));
  system.isCore=true;system._arch=arch;system._ci=ci;
  system.coreProfile=CORE_PROFILES[arch];
  if(ovr&&ovr.name){CORE_NAMES_OVR[ci]=ovr.name;system.coreName=ovr.name;}
  else{delete CORE_NAMES_OVR[ci];system.coreName=JOSEPH_15[3+ci];}
  enhancePiece(system,0);                    // build-time passes + core preset + framing
}
function goCore(ci){
  stopSlideshow();
  applyCoreOverride(ci);                   // builds with locked seed + any Creator-Mode overrides
  curNode=-1;coreView=ci;
  mode="system";zoom=1;az=0;tilt=0.52;clock=0;
  $back.style.display='block';
  $throneNum.disabled=true;$throneGo.disabled=true;
  starIdx=-1;
  AUDIO.setMode('system',CORE_SEEDS[3+ci],0);
  if(typeof starEditor!=='undefined') starEditor.sync();
  if(typeof coreEditor!=='undefined') coreEditor.sync();
}

// Core System editor controller
var coreEditor=(function(){
  var $panel=document.getElementById('coreEditor'),
      $open =document.getElementById('ceOpen'),
      $close=document.getElementById('ceClose'),
      $name =document.getElementById('ceName'),
      $arch =document.getElementById('ceArch'),
      $reset=document.getElementById('ceReset'),
      $seal =document.getElementById('ceSeal');
  // Each archetype can only be held by ONE core system at a time.
  // Only SEALED overrides count as claims so the first author can still pick.
  // Unsealed cores default to their locked index, which is unique by construction
  // (since the dropdown forbids choosing any sealed override's archetype).
  function claimedByOthers(myCi){
    var taken={};
    for(var c=0;c<12;c++){ if(c===myCi) continue;
      var ovr=loadCoreOverride(c);
      if(ovr && typeof ovr.archetype==='number') taken[ovr.archetype]=c;}
    return taken;
  }
  function repopulate(currentArch){
    $arch.innerHTML='';
    var taken=claimedByOthers(coreView);
    CORE_PROFILES.forEach(function(p,i){
      var o=document.createElement('option');
      o.value=i;o.textContent=(i+1<10?'0':'')+(i+1)+' · '+p.replace(/_/g,' ');
      if(taken[i]!=null && i!==currentArch){ o.disabled=true; o.textContent+=' (claimed)'; }
      $arch.appendChild(o);});
    $arch.value=currentArch;
  }
  function fill(){
    var current=(system&&system._arch!=null)?system._arch:coreView;
    repopulate(current);
    $name.value=CORE_NAMES_OVR[coreView]||JOSEPH_15[3+coreView]||'';
  }
  function visible(){return ownMode && mode==='system' && coreView>=0 && !cinematic && !document.body.classList.contains('hero');}
  function sync(){
    var v=visible();
    $open.style.display=v && !$panel.classList.contains('open')?'block':'none';
    if(!v) $panel.classList.remove('open');
    if($panel.classList.contains('open')) fill();
  }
  $arch.addEventListener('change',function(){
    var ci=coreView, arch=+$arch.value, seed=CORE_SEEDS[3+ci];
    system=buildSystem(seed,0);
    extremize(system,mk((seed^0xABCDEF)>>>0),arch);
    if(arch!==5 && arch!==7 && arch!==10) coreBoost(system,mk((seed^0x5A17C0)>>>0));
    system.isCore=true; system._arch=arch; system._ci=ci; system.coreProfile=CORE_PROFILES[arch];
    system.coreName=CORE_NAMES_OVR[ci]||JOSEPH_15[3+ci];
    enhancePiece(system,0);
  });
  $name.addEventListener('input',function(){
    var v=$name.value.trim(),ci=coreView;
    if(v && v!==JOSEPH_15[3+ci]) CORE_NAMES_OVR[ci]=v; else delete CORE_NAMES_OVR[ci];
    if(system) system.coreName=CORE_NAMES_OVR[ci]||JOSEPH_15[3+ci];
  });
  $open.addEventListener('click',function(){$panel.classList.add('open'); fill(); sync();});
  $close.addEventListener('click',function(){$panel.classList.remove('open'); sync();});
  $reset.addEventListener('click',function(){
    localStorage.removeItem(_ceKey(coreView));
    delete CORE_NAMES_OVR[coreView];
    applyCoreOverride(coreView); fill();
  });
  $seal.addEventListener('click',function(){
    var ci=coreView,payload={archetype:system._arch};
    var nm=CORE_NAMES_OVR[ci];
    if(nm && nm!==JOSEPH_15[3+ci]) payload.name=nm;
    localStorage.setItem(_ceKey(ci),JSON.stringify(payload));
    $seal.textContent='SEALED ✦'; setTimeout(function(){$seal.textContent='SEAL ✦';},1400);
  });
  return {sync:sync};
})();

var renderPaused=false;   // off-screen embeds are paused by the parent page
addEventListener('message',function(e){var d=e&&e.data;
  if(d==='kolob:pause')renderPaused=true; else if(d==='kolob:play')renderPaused=false;});
function loop(){
  if(renderPaused){ requestAnimationFrame(loop); return; }   // idle when scrolled off-screen
  if(!paused) clock+=speed*(mode==='galaxy'?1:_dspd);
  // veil cinematic takes over the whole frame while it plays
  if(veilActive){
    veilT+=1/VEIL_DUR;
    if(veilT>=0.5 && !veilDidAdvance){
      var nt=advanceTier(veilNode); goSystem(veilNode); showReward(nt); veilDidAdvance=true; }
    if(veilT>=1){ veilActive=false; document.body.classList.remove('veil'); }
    else { renderVeil(); requestAnimationFrame(loop); return; }
  }
  // ── CINEMATIC, easy-ease glides to a fresh composition every camFreq sec ──
  // prefers-reduced-motion: hold the current composition, do not auto-pan.
  if(cinematic && !REDUCE_MOTION){
    camT++;
    var p=Math.min(1,camT/camDur), e=p*p*p*(p*(p*6-15)+10);   // smootherstep
    az  =camFromAz  +(camToAz  -camFromAz)*e;
    tilt=camFromTilt+(camToTilt-camFromTilt)*e;
    zoom=camFromZoom+(camToZoom-camFromZoom)*e;
    if(camT>=camFreq*60) newCamTarget();
  }
  idleCheck();
  var heroM=document.body.classList.contains('hero');
  var chrome=!cinematic&&!heroM;
  if($galaxyTools) $galaxyTools.style.display=chrome?'flex':'none';
  // EXALT only in galaxy / great-star / core-system views, never on a throne
  if($gtGpu) $gtGpu.style.display=(mode==='galaxy'||mode==='star'||(mode==='system'&&coreView>=0))?'':'none';
  if($controls) $controls.style.display=(mode==='galaxy'&&chrome)?'flex':'none';
  if($back) $back.style.display=(mode!=='galaxy'&&chrome)?'block':'none';
  if($advanceBtn){
    // advance is a paid action, only shown when managing an owned throne (#…&own)
    var up=(ownMode&&mode==='system'&&coreView<0&&chrome&&tierOf(curNode)>0);
    $advanceBtn.style.display=up?'block':'none';
    if(up) $advanceBtn.textContent="ADVANCE TO "+TIER_NAMES[tierOf(curNode)-1]+" ▸";
  }
  if(mode=='galaxy') renderGalaxy();
  else if(mode=='star') renderStar();
  else renderSystem();
  requestAnimationFrame(loop);
}

// ── deep-link router, lets the website link straight to a destination ───
function applyHash(){
  var h=(location.hash||'').replace('#','');
  ownMode=/(?:^|[&:])own\b/.test(h);   // #throne=N&own → manage mode (advance enabled)
  if(h==='hero'){ document.body.classList.add('hero'); if(cinematic)exitCinematic(); goGalaxy(); return; }
  if(!h||h==='explore'){ if(cinematic)exitCinematic(); goGalaxy(); return; }
  if(h==='cinematic'){ goGalaxy(); if(!cinematic)enterCinematic(); return; }
  var m;
  // chrome-free live embeds for the website (Core 15 cards, before/after)
  if((m=h.match(/^embed=(sun|core|throne):(\d+)(?::(\d+))?/))){
    document.body.classList.add('hero');
    var ety=m[1],eid=+m[2],ett=(m[3]!=null?+m[3]:null);
    if(ety==='sun'&&eid<3) goStar(eid);
    else if(ety==='core'&&eid<12) goCore(eid);
    else if(ety==='throne'&&eid<=128) goSystem(eid,ett);
    return;
  }
  if((m=h.match(/^sun=(\d+)/))){ var s=+m[1]; if(s>=0&&s<3)goStar(s); return; }
  if((m=h.match(/^core=(\d+)/))){ var c=+m[1]; if(c>=0&&c<12)goCore(c); return; }
  if((m=h.match(/^throne=(\d+)/))){ var n=+m[1]; if(n>=0&&n<=128){goSystem(n);
    if(/[&:]od\b/.test(h) && system){ system._od=true; AUDIO.silent(); }     // manual Outer Darkness override (preview)
  } return; }
}
addEventListener('hashchange',applyHash);
applyHash();

loop();
</script>
