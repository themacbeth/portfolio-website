<style>
  /* cold-drift particle field behind the hero */
  #driftbg{position:fixed;inset:0;z-index:-1;opacity:.55}
  .book-hero h1{color:#cfd4de}

  /* monumental countdown */
  .monu{display:flex;align-items:baseline;gap:22px;margin-top:34px;flex-wrap:wrap}
  .monu .n{font:700 clamp(72px,14vw,150px)/0.9 var(--mono);color:#e0d6c2;letter-spacing:-0.02em}
  .monu .l{font:10px/1.8 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:#c9a96b;max-width:180px}
  .monu.sealed .n{color:#7a8294}
  .monu.sealed .l{color:#7a8294}

  .epitaph{font:italic clamp(17px,2.6vw,24px)/1.8 Georgia,serif;color:#8b8f9a;
    margin:56px 0 0;max-width:520px}
  .epitaph b{color:#cfd4de;font-weight:400}

  /* stats strip */
  .bookstats{display:flex;gap:2px;margin-top:44px;flex-wrap:wrap}
  .bs{flex:1;min-width:150px;padding:20px 18px;background:rgba(255,255,255,.03)}
  .bs .n{font:700 34px/1 var(--mono);color:#e0d6c2}
  .bs .l{margin-top:8px;font:9px/1.5 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#7d818f}
  .bs.dark{background:#060405;border:1px solid #1a1410}

  /* the wall of cells — each a small living canvas */
  .bookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:2px;margin-top:30px}
  .bk{aspect-ratio:1;position:relative;display:block;background:#020204;border:1px solid #101018;
    overflow:hidden;text-decoration:none;transition:border-color .25s,transform .25s}
  .bk:hover{border-color:#4a4f5e;transform:scale(1.04);z-index:2}
  .bk canvas{position:absolute;inset:0;width:100%;height:100%}
  .bk .id{position:absolute;bottom:6px;left:7px;font:9px/1 var(--mono);color:#5a5e6b;z-index:1}
  .bk .rim{position:absolute;top:6px;right:7px;font:8px/1 var(--mono);letter-spacing:.14em;color:#3f6d8a;z-index:1}
  .bk.fallen{border-color:#141414}
  .bk.fallen .id{color:#4a4a50}
  .bk.fallen .rim{color:#55555c}
  .bk.fallen:hover{border-color:#3a3a40}

  .booknote{margin-top:22px;font:11px/1.7 var(--mono);color:#6b6f7c;letter-spacing:.04em}
</style>

<script>
"use strict";
/* ── same derivation as collection.html / the pod ── */
var HASH="0x4b4f4c42a17f0c3e9d5b8e2160f47a93c8d1e0b6452f9a3c7e1d80b54f2a69c3";
var TAU=6.28318530718;
function hashSeed(h){var s=0;for(var i=2;i<h.length;i++) s=(Math.imul(s,16)+parseInt(h[i],16)+1)|0;return s>>>0;}
function PRNG(seed){var a=seed^0x9e3779b9,b=seed^0x243f6a88,c=seed^0xb7e15162,d=1;
  return function(){a|=0;b|=0;c|=0;d|=0;var t=(a+b|0)+d|0;d=d+1|0;
    a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);c=c+t|0;return (t>>>0)/4294967296;};}
function mk(seed){var r=PRNG(seed>>>0);
  r.int=function(a,b){return a+((r()*(b-a+1))|0);};
  r.g=function(){var u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v);};
  return r;}
var STAR=[ {col:[117,225,255],w:0.003},{col:[67,205,255],w:0.13},{col:[235,245,255],w:0.61},
 {col:[255,250,225],w:3.0},{col:[255,221,55],w:7.6},{col:[255,140,40],w:12},{col:[248,43,118],w:76}];
var STARW=(function(){var s=0,a=[];for(var i=0;i<STAR.length;i++){s+=STAR[i].w;a.push(s);}return{a:a,t:s};})();
function pickStar(r){var x=r()*STARW.t;for(var i=0;i<STARW.a.length;i++) if(x<STARW.a[i]) return i;return 6;}
function tierOf(i){var v=null;try{v=localStorage.getItem('kolob:'+HASH.slice(2,10)+':'+i);}catch(e){}
  return v===null?2:Math.max(0,Math.min(2,+v));}
var DEADLINE=Date.UTC(2026,9,22);
var sealed=Date.now()>=DEADLINE;
var H0=hashSeed(HASH);

/* ── the wall: one small living canvas per throne at the rim ── */
var CELLS=[];      // {ctx, pts[], col, fallen, on}
var CS=120;        // internal canvas resolution

function makeCell(i,fallen){
  var nr=mk((H0+(i+1)*8675309)>>>0);
  nr.int(0,3);nr();nr.g();nr.g();
  var col=STAR[pickStar(nr)].col;
  if(fallen) col=[168,180,200];                       // the grey of the drift

  var a=document.createElement('a');
  a.className='bk'+(fallen?' fallen':'');
  a.href='token.html?inv='+(15+i)+(fallen?'&od':'&tier=2');
  a.title='Throne '+i+(fallen?' · fallen into Outer Darkness':' · at the Telestial rim');
  var cv=document.createElement('canvas');cv.width=CS;cv.height=CS;
  a.appendChild(cv);
  var id=document.createElement('span');id.className='id';
  id.textContent=("00"+i).slice(-3);a.appendChild(id);
  var rim=document.createElement('span');rim.className='rim';
  rim.textContent=fallen?'FALLEN':'AT RISK';a.appendChild(rim);

  // a seeded constellation: motes + one brighter heart
  var pr=mk((H0^Math.imul(i+7,2654435761))>>>0),pts=[],n=22+pr.int(0,10);
  for(var q=0;q<n;q++) pts.push({
    x:pr()*CS,y:pr()*CS,
    vx:(pr()-0.5)*(fallen?0.05:0.12),
    vy:fallen?(0.03+pr()*0.08):((pr()-0.5)*0.12),   // the fallen sink
    sz:pr()<0.12?2:1,bri:0.25+pr()*0.6,ph:pr()*TAU});
  var cell={ctx:cv.getContext('2d'),pts:pts,col:col,fallen:fallen,on:false,
    hx:CS*(0.3+pr()*0.4),hy:CS*(0.3+pr()*0.4)};
  CELLS.push(cell);
  io.observe(cv);cv._cell=cell;
  return a;
}

var io=new IntersectionObserver(function(es){es.forEach(function(e){
  if(e.target._cell)e.target._cell.on=e.isIntersecting;});},{rootMargin:'80px'});

var _t=0;
function tick(){
  _t+=1/60;
  for(var c=0;c<CELLS.length;c++){var cl=CELLS[c];
    if(!cl.on)continue;
    var x=cl.ctx,col=cl.col;
    x.fillStyle='#020204';x.fillRect(0,0,CS,CS);
    // the heart: a slow-breathing brighter star
    var hb=cl.fallen?0.30:(0.55+0.30*Math.sin(_t*0.8+cl.pts[0].ph));
    x.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+hb.toFixed(2)+')';
    x.fillRect(cl.hx-1,cl.hy-1,3,3);
    x.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+(hb*0.25).toFixed(2)+')';
    x.fillRect(cl.hx-3,cl.hy-3,7,7);
    // the motes
    for(var q=0;q<cl.pts.length;q++){var p=cl.pts[q];
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x+=CS;if(p.x>CS)p.x-=CS;
      if(p.y<0)p.y+=CS;if(p.y>CS)p.y-=CS;
      var tw=cl.fallen?p.bri*0.5:p.bri*(0.6+0.4*Math.sin(_t*1.6+p.ph));
      x.fillStyle='rgba('+col[0]+','+col[1]+','+col[2]+','+(tw*0.55).toFixed(2)+')';
      x.fillRect(p.x|0,p.y|0,p.sz,p.sz);}
  }
  requestAnimationFrame(tick);
}

function build(){
  CELLS.length=0;
  var book=document.getElementById('book');book.innerHTML='';
  var atRim=0,advanced=0;
  for(var i=0;i<129;i++){
    if(tierOf(i)===2){atRim++;book.appendChild(makeCell(i,sealed));}
    else advanced++;
  }
  var lede=document.getElementById('bookLede'),
      note=document.getElementById('bookNote'),
      stats=document.getElementById('stats'),
      monu=document.getElementById('monu');
  if(sealed){
    monu.classList.add('sealed');
    monu.querySelector('.n').textContent=atRim;
    monu.querySelector('.n').classList.remove('odDays');
    document.getElementById('monuLabel').innerHTML='thrones fell at the rim<br>sealed 22 October 2026';
    lede.textContent='The seal has passed. Every throne recorded here fell at the rim and drifted into Outer Darkness. This page does not change again.';
    note.textContent='The advanced are not in the book. The chain remembers the rest.';
    document.getElementById('ctaBtn').style.display='none';
    stats.innerHTML=
      '<div class="bs dark"><div class="n">'+atRim+'</div><div class="l">Fallen · permanent</div></div>'+
      '<div class="bs"><div class="n">'+advanced+'</div><div class="l">Advanced in time</div></div>';
  }else{
    lede.textContent='When the seal passes, every throne still at the Telestial rim is written here, permanently. The book is open. It does not have to include you.';
    note.textContent='Every cell is a throne at the rim today. Advance one and it leaves the book. Click any cell to preview its drift.';
    stats.innerHTML=
      '<div class="bs dark"><div class="n">'+atRim+'</div><div class="l">At the rim · at risk</div></div>'+
      '<div class="bs"><div class="n">'+advanced+'</div><div class="l">Advanced · out of the book</div></div>';
  }
}
build();
tick();
addEventListener('storage',build);   // advancing in another tab removes it from the book, live

/* ── cold-drift background field ── */
(function(){
  var cv=document.getElementById('driftbg'),ctx=cv.getContext('2d'),W,H,pts=[];
  var DPR=Math.min(2,window.devicePixelRatio||1);
  function fit(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;
    cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';}
  fit();addEventListener('resize',fit);
  for(var i=0;i<420;i++)pts.push({x:Math.random(),y:Math.random(),
    vx:(0.12+Math.random()*0.3),vy:(Math.random()*0.14-0.07),
    sz:Math.random()<0.1?2:1,bri:0.12+Math.random()*0.30});
  (function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    for(var i=0;i<pts.length;i++){var p=pts[i];
      p.x+=p.vx/1800;p.y+=p.vy/1800;
      if(p.x>1.01)p.x=-0.01;if(p.y>1.01)p.y=-0.01;if(p.y<-0.01)p.y=1.01;
      ctx.fillStyle='rgba(160,180,210,'+p.bri.toFixed(2)+')';
      ctx.fillRect((p.x*W)|0,(p.y*H)|0,p.sz*DPR,p.sz*DPR);}
    requestAnimationFrame(draw);
  })();
})();
</script>
