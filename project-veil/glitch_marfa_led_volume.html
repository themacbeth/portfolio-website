<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;background:#000}
canvas{display:block}
#info{position:fixed;top:12px;left:16px;font:11px/1.6 monospace;color:#666;pointer-events:none;z-index:10}
#info strong{color:#7fffaa}
#info .dim{color:#333}
#controls{position:fixed;bottom:16px;left:16px;font:10px monospace;color:#444;z-index:10}
#controls span{color:#666;cursor:pointer;margin-right:12px;padding:4px 8px;border:1px solid #222}
#controls span:hover{color:#7fffaa;border-color:#7fffaa}
#controls span.active{color:#7fffaa;border-color:#7fffaa}
#scene-controls{position:fixed;top:12px;right:16px;font:10px monospace;color:#444;z-index:10}
#scene-controls span{color:#666;cursor:pointer;margin-left:8px;padding:4px 8px;border:1px solid #222}
#scene-controls span:hover{color:#7fffaa;border-color:#7fffaa}
#scene-controls span.active{color:#7fffaa;border-color:#7fffaa}
</style>
</head>
<body>
<div id="info">
  <strong>THE VEIL · 3D LED VOLUME</strong><br>
  16×24 vertical LED strands, 32 pixels each (~12,000 voxels)<br>
  <span class="dim">25ft × 30ft × 14ft · drag to orbit, scroll to zoom</span>
</div>
<div id="controls">
  <span class="active" onclick="setView('overview',this)">Overview</span>
  <span onclick="setView('viewer',this)">Viewer POV</span>
  <span onclick="setView('top',this)">Top Down</span>
  <span onclick="setView('side',this)">Side</span>
  <span onclick="setView('behind',this)">Behind</span>
</div>
<div id="scene-controls">
  <span class="active" onclick="setScene('galaxy',this)">Galaxy</span>
  <span onclick="setScene('sun',this)">Sun</span>
  <span onclick="setScene('core',this)">Core</span>
  <span onclick="setScene('auto',this)">Auto</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x040410,.003);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.6;
document.body.appendChild(renderer.domElement);

// Units: 1 unit = 1 foot
const RW=25,RD=30,RH=14;

// Floor
const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(RW,RD),
  new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:.85,metalness:.1})
);
floor.rotation.x=-Math.PI/2; floor.position.set(RW/2,0,RD/2);
scene.add(floor);

// Rug
const rug=new THREE.Mesh(
  new THREE.PlaneGeometry(10,12),
  new THREE.MeshStandardMaterial({color:0x4a1515,roughness:.9})
);
rug.rotation.x=-Math.PI/2; rug.position.set(RW/2,.01,RD/2);
scene.add(rug);

// Room outline
const roomOutline=new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.PlaneGeometry(RW,RD)),
  new THREE.LineBasicMaterial({color:0x555555,transparent:true,opacity:.5})
);
roomOutline.rotation.x=-Math.PI/2; roomOutline.position.set(RW/2,.02,RD/2);
scene.add(roomOutline);

// Corner posts
[[0,0],[RW,0],[0,RD],[RW,RD]].forEach(([cx,cz])=>{
  const post=new THREE.Mesh(
    new THREE.CylinderGeometry(.05,.05,RH,4),
    new THREE.MeshBasicMaterial({color:0x444444,transparent:true,opacity:.3})
  );
  post.position.set(cx,RH/2,cz);
  scene.add(post);
});

// Ceiling baffles
for(let i=0;i<12;i++){
  const slat=new THREE.Mesh(
    new THREE.BoxGeometry(RW-.5,.15,.4),
    new THREE.MeshStandardMaterial({color:0x999999,roughness:.7})
  );
  slat.position.set(RW/2,RH-.3,2+i*(RD-4)/11);
  scene.add(slat);
}

// ─── 3D LED VOLUME ──────────────────────────────────────────────────
// Grid of vertical strands hanging from ceiling.
// Footprint: ~10ft (x) × 14ft (z), center of room
// Strand spacing: ~0.7ft
// Each strand: 32 LED pixels from y=2 to y=11

const NX=16, NZ=24, NY=32;             // grid dims
const VX0 = RW/2 - 5,   VX1 = RW/2 + 5;
const VZ0 = RD/2 - 7,   VZ1 = RD/2 + 7;
const VY0 = 2,          VY1 = 11;

// Strand wires (thin lines to suggest the physical strands)
const wireMat=new THREE.LineBasicMaterial({color:0x222222,transparent:true,opacity:.35});
for(let ix=0;ix<NX;ix++){
  for(let iz=0;iz<NZ;iz++){
    const x = VX0 + (ix/(NX-1))*(VX1-VX0);
    const z = VZ0 + (iz/(NZ-1))*(VZ1-VZ0);
    const g=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(x,RH,z),
      new THREE.Vector3(x,VY0-.2,z)
    ]);
    scene.add(new THREE.Line(g,wireMat));
  }
}

// Voxel point cloud — one Points object, color per voxel
const TOTAL = NX*NY*NZ;
const positions=new Float32Array(TOTAL*3);
const colors   =new Float32Array(TOTAL*3);
let k=0;
const voxelIdx=[]; // store (ix,iy,iz) and world (x,y,z) for shader-free coloring
for(let ix=0;ix<NX;ix++){
  for(let iy=0;iy<NY;iy++){
    for(let iz=0;iz<NZ;iz++){
      const x = VX0 + (ix/(NX-1))*(VX1-VX0);
      const y = VY0 + (iy/(NY-1))*(VY1-VY0);
      const z = VZ0 + (iz/(NZ-1))*(VZ1-VZ0);
      positions[k*3+0]=x;
      positions[k*3+1]=y;
      positions[k*3+2]=z;
      colors[k*3+0]=0; colors[k*3+1]=0; colors[k*3+2]=0;
      voxelIdx.push({ix,iy,iz,x,y,z});
      k++;
    }
  }
}
const voxGeo=new THREE.BufferGeometry();
voxGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
voxGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const voxMat=new THREE.PointsMaterial({
  size:.18,
  vertexColors:true,
  transparent:true,
  opacity:.95,
  blending:THREE.AdditiveBlending,
  depthWrite:false,
  sizeAttenuation:true
});
const voxPoints=new THREE.Points(voxGeo,voxMat);
scene.add(voxPoints);

// ─── Scene content for the volume ─────────────────────────────────
// Each scene returns RGB for a voxel given its (nx,ny,nz) in 0..1 and time t

const VCX = (VX0+VX1)/2, VCY=(VY0+VY1)/2, VCZ=(VZ0+VZ1)/2;
const HX = (VX1-VX0)/2,  HY=(VY1-VY0)/2,  HZ=(VZ1-VZ0)/2;

function scGalaxy(v,t){
  // Disc in horizontal XZ plane, with spiral arms; thin in Y.
  const dx=(v.x-VCX)/HX, dz=(v.z-VCZ)/HZ, dy=(v.y-VCY)/HY;
  const r=Math.sqrt(dx*dx+dz*dz);
  const theta=Math.atan2(dz,dx);
  if(r>1.05) return null;
  // Spiral density: two arms
  const arms=2, twist=3.5;
  const armPhase=Math.sin(arms*(theta+r*twist+t*.4))*.5+.5;
  const discY=Math.exp(-Math.pow(dy/.18,2));      // thin disc
  const radial=Math.exp(-Math.pow((r-.55)/.5,2)) + Math.exp(-Math.pow(r/.12,2))*1.6; // arms + bulge
  const v_ = radial*discY*(.35+armPhase*.85);
  if(v_<.06) return null;
  // Color: warm core, cool arms
  const warm=Math.exp(-Math.pow(r/.18,2));
  return [v_*(.45+warm*.55), v_*(.55+warm*.2), v_*(.95-warm*.3)];
}

function scSun(v,t){
  const dx=(v.x-VCX)/HX, dy=(v.y-VCY)/HY, dz=(v.z-VCZ)/HZ;
  const r=Math.sqrt(dx*dx+dy*dy+dz*dz);
  // Core sphere + corona shells
  const core=Math.exp(-Math.pow(r/.22,2));
  const corona=Math.exp(-Math.pow((r-.55)/.18,2))*( .55+.45*Math.sin(t*1.2+r*8));
  const v_ = core*1.2 + corona*.55;
  if(v_<.06) return null;
  // Warm orange/yellow
  return [v_*1.0, v_*(.55+.25*Math.sin(t*.8)), v_*.15];
}

function scCore(v,t){
  const dx=(v.x-VCX)/HX, dy=(v.y-VCY)/HY, dz=(v.z-VCZ)/HZ;
  const r=Math.sqrt(dx*dx+dy*dy+dz*dz);
  // Sealed center + triad of orbiting points + outer ring of 12
  const center=Math.exp(-Math.pow(r/.10,2))*1.4;
  // Triad of orbiting suns in plane y=0
  let triad=0;
  for(let k=0;k<3;k++){
    const a=k/3*Math.PI*2 + t*.35;
    const tx=.35*Math.cos(a), tz=.35*Math.sin(a);
    const d=Math.sqrt((dx-tx)*(dx-tx)+dy*dy+(dz-tz)*(dz-tz));
    triad += Math.exp(-Math.pow(d/.10,2))*1.0;
  }
  // Outer ring of 12 governing systems
  let ring=0;
  for(let k=0;k<12;k++){
    const a=k/12*Math.PI*2 - t*.12;
    const tx=.78*Math.cos(a), tz=.78*Math.sin(a);
    const d=Math.sqrt((dx-tx)*(dx-tx)+dy*dy+(dz-tz)*(dz-tz));
    ring += Math.exp(-Math.pow(d/.06,2))*.7;
  }
  const v_ = center + triad + ring;
  if(v_<.08) return null;
  // Gold/cyan blend
  return [v_*.85, v_*.95, v_*(.7+.3*Math.sin(t*.5))];
}

const scenes={galaxy:scGalaxy, sun:scSun, core:scCore};
let activeScene='galaxy';
let autoMode=false;

function setScene(name,el){
  document.querySelectorAll('#scene-controls span').forEach(s=>s.classList.remove('active'));
  if(el)el.classList.add('active');
  if(name==='auto'){autoMode=true} else {autoMode=false; activeScene=name}
}

// ─── Laser ──────────────────────────────────────────────────
// One laser firing through the volume, lighting key anchor points only
const laserBody=new THREE.Mesh(
  new THREE.BoxGeometry(.8,.5,1),
  new THREE.MeshStandardMaterial({color:0x111111,metalness:.5,roughness:.3})
);
laserBody.position.set(RW/2,4,2);
scene.add(laserBody);

const lens=new THREE.Mesh(
  new THREE.CircleGeometry(.12,16),
  new THREE.MeshStandardMaterial({color:0x7fffaa,emissive:0x33ff77,emissiveIntensity:2})
);
lens.position.set(RW/2,4,2.51);
scene.add(lens);

const beamGroup=new THREE.Group();
scene.add(beamGroup);
const laserPos=new THREE.Vector3(RW/2,4,2.5);
// 12 thin beams firing through the volume
for(let i=0;i<12;i++){
  const angle=(i/11-.5)*0.3;
  const vAngle=(i%3-1)*.05;
  const endX=RW/2+Math.tan(angle)*(RD-3);
  const endY=4+Math.tan(vAngle)*(RD-3);
  const endZ=RD-1;
  const geo=new THREE.BufferGeometry().setFromPoints([laserPos,new THREE.Vector3(endX,endY,endZ)]);
  beamGroup.add(new THREE.Line(geo,new THREE.LineBasicMaterial({
    color:0x7fffaa,transparent:true,opacity:.16,blending:THREE.AdditiveBlending
  })));
}

// Haze
const hazeGeo=new THREE.BufferGeometry();
const hazeCount=1500;
const hazePos=new Float32Array(hazeCount*3);
for(let i=0;i<hazeCount;i++){
  hazePos[i*3]=Math.random()*RW;
  hazePos[i*3+1]=Math.random()*RH;
  hazePos[i*3+2]=Math.random()*RD;
}
hazeGeo.setAttribute('position',new THREE.BufferAttribute(hazePos,3));
scene.add(new THREE.Points(hazeGeo,new THREE.PointsMaterial({
  color:0x445566,size:.07,transparent:true,opacity:.22,
  blending:THREE.AdditiveBlending,depthWrite:false
})));

// Ambient
scene.add(new THREE.AmbientLight(0x222244,.6));

// Speaker
const speaker=new THREE.Mesh(
  new THREE.BoxGeometry(.8,1.2,.6),
  new THREE.MeshStandardMaterial({color:0x1a1a1a,roughness:.8})
);
speaker.position.set(RW-2,2.5,RD/2);
scene.add(speaker);

// ─── Floor labels ──
function makeLabel(text,x,y,z,color){
  const canvas=document.createElement('canvas');
  canvas.width=512;canvas.height=64;
  const ctx=canvas.getContext('2d');
  ctx.font='24px monospace';
  ctx.fillStyle=color||'#444';
  ctx.textAlign='center';
  ctx.fillText(text,256,40);
  const tex=new THREE.CanvasTexture(canvas);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:.7,depthTest:false}));
  sprite.position.set(x,y,z);
  sprite.scale.set(5,.6,1);
  scene.add(sprite);
}
makeLabel('LASER',RW/2,.3,2,'#7fffaa');
makeLabel('3D LED VOLUME',RW/2,.3,RD/2,'#888888');
makeLabel('VIEWER ZONE',RW/2+8,.3,RD/2,'#44aa44');
makeLabel('SPEAKER',RW-2,.3,RD/2+2,'#666');

// Viewer zone
const zone=new THREE.Mesh(
  new THREE.PlaneGeometry(8,20),
  new THREE.MeshBasicMaterial({color:0x005500,transparent:true,opacity:.10,side:THREE.DoubleSide})
);
zone.rotation.x=-Math.PI/2; zone.position.set(RW/2+8,.02,RD/2);
scene.add(zone);

// ─── Camera orbit ──
let isDragging=false,prevX=0,prevY=0;
let camTheta=.5,camPhi=.4,camDist=28;
let targetTheta=camTheta,targetPhi=camPhi,targetDist=camDist;
let lookAt=new THREE.Vector3(RW/2,5,RD/2);
let targetLookAt=lookAt.clone();

renderer.domElement.addEventListener('mousedown',e=>{isDragging=true;prevX=e.clientX;prevY=e.clientY});
renderer.domElement.addEventListener('mousemove',e=>{
  if(!isDragging)return;
  targetTheta+=(e.clientX-prevX)*.005;
  targetPhi=Math.max(.1,Math.min(Math.PI/2-.05,targetPhi-(e.clientY-prevY)*.005));
  prevX=e.clientX;prevY=e.clientY;
});
renderer.domElement.addEventListener('mouseup',()=>isDragging=false);
renderer.domElement.addEventListener('wheel',e=>{targetDist=Math.max(5,Math.min(100,targetDist+e.deltaY*.03))});

let touchDist=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true;prevX=e.touches[0].clientX;prevY=e.touches[0].clientY}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;touchDist=Math.sqrt(dx*dx+dy*dy)}
});
renderer.domElement.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    targetTheta+=(e.touches[0].clientX-prevX)*.005;
    targetPhi=Math.max(.1,Math.min(Math.PI/2-.05,targetPhi-(e.touches[0].clientY-prevY)*.005));
    prevX=e.touches[0].clientX;prevY=e.touches[0].clientY;
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy);targetDist=Math.max(5,Math.min(100,targetDist-(d-touchDist)*.05));touchDist=d;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>isDragging=false);

function setView(name,el){
  document.querySelectorAll('#controls span').forEach(s=>s.classList.remove('active'));
  if(el)el.classList.add('active');
  if(name==='overview'){targetTheta=.5;targetPhi=.4;targetDist=28;targetLookAt.set(RW/2,5,RD/2)}
  else if(name==='viewer'){targetTheta=-.3;targetPhi=.15;targetDist=12;targetLookAt.set(RW/2,5,15)}
  else if(name==='top'){targetTheta=0;targetPhi=1.5;targetDist=32;targetLookAt.set(RW/2,0,RD/2)}
  else if(name==='side'){targetTheta=Math.PI/2;targetPhi=.2;targetDist=22;targetLookAt.set(RW/2,5,RD/2)}
  else if(name==='behind'){targetTheta=Math.PI;targetPhi=.2;targetDist=10;targetLookAt.set(RW/2,5,RD-4)}
}

// initial
camera.position.set(20,12,22);

// ─── Animate ──
const colorAttr=voxGeo.getAttribute('color');
let lastUpdate=0;
const UPDATE_HZ=20; // update voxel colors at 20Hz (cheap)

function animate(time){
  requestAnimationFrame(animate);
  const t=time*.001;

  // Smooth camera
  camTheta+=(targetTheta-camTheta)*.06;
  camPhi+=(targetPhi-camPhi)*.06;
  camDist+=(targetDist-camDist)*.06;
  lookAt.lerp(targetLookAt,.04);
  camera.position.set(
    lookAt.x+Math.sin(camTheta)*Math.cos(camPhi)*camDist,
    lookAt.y+Math.sin(camPhi)*camDist,
    lookAt.z+Math.cos(camTheta)*Math.cos(camPhi)*camDist
  );
  camera.lookAt(lookAt);

  // Auto scene cycle
  if(autoMode){
    const seq=['galaxy','sun','core'];
    activeScene=seq[Math.floor(t/6)%3];
  }

  // Update voxel colors
  if(time-lastUpdate>1000/UPDATE_HZ){
    lastUpdate=time;
    const fn=scenes[activeScene];
    const arr=colorAttr.array;
    for(let i=0;i<voxelIdx.length;i++){
      const v=voxelIdx[i];
      const c=fn(v,t);
      if(c){ arr[i*3]=c[0]; arr[i*3+1]=c[1]; arr[i*3+2]=c[2]; }
      else { arr[i*3]=0; arr[i*3+1]=0; arr[i*3+2]=0; }
    }
    colorAttr.needsUpdate=true;
  }

  lens.material.emissiveIntensity=2+Math.sin(t*3)*.5;
  beamGroup.children.forEach((b,i)=>{
    b.material.opacity=.14+Math.sin(t*1.5+i*.3)*.05;
  });

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate(0);
</script>
</body>
</html>
