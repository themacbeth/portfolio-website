<!DOCTYPE html>
<html>
<head>
<style>
*{margin:0;padding:0;background:#000;box-sizing:border-box}
canvas{display:block}
body{font:11px/1.5 ui-monospace,monospace;color:#888;overflow:hidden}
#info{position:fixed;top:14px;left:18px;z-index:10;pointer-events:none;max-width:340px}
#info .ttl{color:#ffd58a;letter-spacing:.22em;font-weight:600;margin-bottom:4px}
#info .sub{color:#555;font-size:10px;letter-spacing:.1em}
#views{position:fixed;top:14px;right:18px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:260px}
#views span{color:#777;cursor:pointer;padding:4px 9px;border:1px solid #222;font-size:10px;letter-spacing:.1em}
#views span:hover,#views span.active{color:#ffd58a;border-color:#ffd58a}
#timeline{position:fixed;bottom:14px;left:18px;right:18px;z-index:10;
  background:rgba(0,0,0,.7);border:1px solid #1f1f1f;padding:10px 14px;border-radius:3px}
#tl-row{display:flex;align-items:baseline;gap:18px;font-size:10px;letter-spacing:.12em;color:#666;margin-bottom:8px}
#tl-row .now{color:#ffd58a;font-size:11px;letter-spacing:.18em;flex:1}
#tl-row .clock{color:#888;font-variant-numeric:tabular-nums}
#tl-row .next{color:#444}
#tl-track{height:32px;background:#0a0a0a;border:1px solid #181818;border-radius:2px;position:relative;overflow:hidden;cursor:pointer}
#tl-track:hover{border-color:#3a3a3a}
.tl-seg{position:absolute;top:0;bottom:0;border-right:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;color:#666;font-size:9px;letter-spacing:.06em;
  cursor:pointer;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;padding:0 4px;transition:color .1s,background .1s;pointer-events:auto}
.tl-seg:hover{color:#ffd58a;background:rgba(255,213,138,.05)}
.tl-seg.active{color:#ffd58a;background:rgba(255,213,138,.10)}
#tl-head{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffd58a;box-shadow:0 0 10px #ffd58a;pointer-events:none}
#hud{position:fixed;bottom:62px;right:18px;z-index:10;font-size:10px;color:#555;text-align:right;letter-spacing:.1em}
#hud b{color:#ffd58a;font-weight:normal}
#beat{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;gap:10px;pointer-events:none}
#beat span{display:block;width:14px;height:14px;border:1px solid #2a2a2a;border-radius:50%;
  background:#0a0a0a;transition:background .08s,box-shadow .08s,border-color .08s}
#beat span.on{background:#ffd58a;border-color:#ffd58a;box-shadow:0 0 12px #ffd58a}
#beat span.bar{border-color:#7fffaa}
#beat span.bar.on{background:#7fffaa;box-shadow:0 0 14px #7fffaa}
#tempo{position:fixed;bottom:88px;right:18px;z-index:10;font-size:10px;color:#555;letter-spacing:.15em;text-align:right}
#tempo b{color:#ffd58a;font-weight:normal}
#tempo .swell{margin-top:4px;width:140px;height:3px;background:#1a1a1a;border-radius:1px;overflow:hidden}
#tempo .swell i{display:block;height:100%;background:linear-gradient(90deg,#5a4220,#ffd58a);width:0;transition:width .04s}
#sndBtn{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:30;
  background:rgba(0,0,0,.92);border:1px solid #ffd58a;color:#ffd58a;
  font:12px/1 ui-monospace,monospace;padding:12px 28px;letter-spacing:.22em;
  cursor:pointer;border-radius:2px;box-shadow:0 0 18px rgba(255,213,138,.25)}
#sndBtn:hover{box-shadow:0 0 24px rgba(255,213,138,.45)}
#sndBtn.on{color:#7fffaa;border-color:#7fffaa;box-shadow:0 0 18px rgba(127,255,170,.25)}
#sndBtn.err{color:#ff7777;border-color:#ff7777}
#sndMsg{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:30;
  color:#888;font:10px/1.4 ui-monospace,monospace;letter-spacing:.1em;text-align:center;
  background:rgba(0,0,0,.6);padding:4px 10px;border-radius:2px;display:none;max-width:480px}
#xport{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:11;
  display:flex;gap:8px;background:rgba(0,0,0,.0);padding:0;pointer-events:none}
#xport button{pointer-events:auto;background:rgba(0,0,0,.8);border:1px solid #2a2a2a;
  color:#ffd58a;font:10px/1 ui-monospace,monospace;padding:6px 14px;letter-spacing:.18em;
  cursor:pointer;border-radius:2px;margin-bottom:48px}
#xport button:hover{border-color:#ffd58a}
</style>
</head>
<body>
<div id="info">
  <div class="ttl">CELESTIAL COLUMN · 4:00 PROGRAM</div>
  <div class="sub">IBW-P-62.5 · 8 × 48 × 8 voxels · 3m tall</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ───────────────────────────────────────────────────────────
// SCENE GRAPH
// ───────────────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x040408,0.025);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.05,80);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.5;
document.body.appendChild(renderer.domElement);

// Floor disc (just a hint of ground for spill)
const disc=new THREE.Mesh(new THREE.CircleGeometry(8,48),
  new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:.9,metalness:.05}));
disc.rotation.x=-Math.PI/2; disc.position.y=0; scene.add(disc);

// ───────────────────────────────────────────────────────────
// COLUMN  (IBW-P-62.5: 8 × 48 × 8 voxels, 0.5m × 3m × 0.5m)
// Units: meters
// ───────────────────────────────────────────────────────────
const NX=8, NY=48, NZ=8;
const W=0.5, H=3.0, D=0.5;
const X0=-W/2, X1=W/2, Y0=0.15, Y1=Y0+H, Z0=-D/2, Z1=D/2;
const CX=0, CY=(Y0+Y1)/2, CZ=0;

// Strand wires (vertical) + top mount plate
const wireMat=new THREE.LineBasicMaterial({color:0x1f1f1f,transparent:true,opacity:.55});
for(let ix=0;ix<NX;ix++) for(let iz=0;iz<NZ;iz++){
  const x=X0+(ix/(NX-1))*W, z=Z0+(iz/(NZ-1))*D;
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(x,Y1+.15,z), new THREE.Vector3(x,Y0-.05,z)
  ]),wireMat));
}
const plate=new THREE.Mesh(new THREE.BoxGeometry(W+.1,.04,D+.1),
  new THREE.MeshStandardMaterial({color:0x222222,roughness:.6}));
plate.position.set(0,Y1+.15,0); scene.add(plate);
// Suspension cables up into the dark
for(let dx=-1;dx<=1;dx+=2) for(let dz=-1;dz<=1;dz+=2){
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(dx*(W/2+.03),Y1+.18,dz*(D/2+.03)),
    new THREE.Vector3(dx*(W/2+.03),Y1+1.6,dz*(D/2+.03))
  ]),new THREE.LineBasicMaterial({color:0x333333,transparent:true,opacity:.6})));
}

// Voxels
const TOTAL=NX*NY*NZ;
const positions=new Float32Array(TOTAL*3);
const colors=new Float32Array(TOTAL*3);
const vox=[]; let k=0;
for(let ix=0;ix<NX;ix++) for(let iy=0;iy<NY;iy++) for(let iz=0;iz<NZ;iz++){
  const x=X0+(ix/(NX-1))*W, y=Y0+(iy/(NY-1))*H, z=Z0+(iz/(NZ-1))*D;
  positions[k*3]=x; positions[k*3+1]=y; positions[k*3+2]=z;
  vox.push({x,y,z,
    nx:(x-CX)/(W/2),
    ny:(y-CY)/(H/2),
    nz:(z-CZ)/(D/2)
  });
  k++;
}
const vGeo=new THREE.BufferGeometry();
vGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
vGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const vPts=new THREE.Points(vGeo,new THREE.PointsMaterial({
  size:.045,vertexColors:true,transparent:true,opacity:1,
  blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
}));
scene.add(vPts);

// Atmospheric haze
const haze=new THREE.BufferGeometry();
const hazeN=800;
const hazeP=new Float32Array(hazeN*3);
for(let i=0;i<hazeN;i++){
  const a=Math.random()*Math.PI*2, r=2+Math.random()*4;
  hazeP[i*3]=Math.cos(a)*r; hazeP[i*3+1]=Math.random()*4.5; hazeP[i*3+2]=Math.sin(a)*r;
}
haze.setAttribute('position',new THREE.BufferAttribute(hazeP,3));
scene.add(new THREE.Points(haze,new THREE.PointsMaterial({
  color:0x445566,size:.025,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false
})));

scene.add(new THREE.AmbientLight(0x222233,.4));
const spill=new THREE.PointLight(0xffcc88,1.2,6);
spill.position.set(0,CY,0); scene.add(spill);

// ───────────────────────────────────────────────────────────
// SCENES — each returns [r,g,b] in [0..~2]
// v has {x,y,z, nx,ny,nz} (n* normalised to -1..1 within column)
// localT is seconds since this scene began
// ───────────────────────────────────────────────────────────

function clamp01(x){return x<0?0:(x>1?1:x)}
function expBell(x,s){return Math.exp(-(x*x)/(s*s))}
// HSL → RGB (h,s,l in 0..1)
function hsl2rgb(h,s,l){
  const c=(1-Math.abs(2*l-1))*s;
  const x=c*(1-Math.abs(((h*6)%2)-1));
  const m=l-c/2;
  let r=0,g=0,b=0;
  const seg=Math.floor(h*6)%6;
  if(seg===0){r=c;g=x;b=0}
  else if(seg===1){r=x;g=c;b=0}
  else if(seg===2){r=0;g=c;b=x}
  else if(seg===3){r=0;g=x;b=c}
  else if(seg===4){r=x;g=0;b=c}
  else {r=c;g=0;b=x}
  return [r+m,g+m,b+m];
}

// ───────────────────────────────────────────────────────────
// VIRTUAL BEAT CLOCK — 66 BPM drone hymnal
//   beat   = 60/66 = 0.9091 sec  (the kick / bass drone hit)
//   bar    = 4 beats = 3.6364 sec
//   phrase = 4 bars  = 14.5454 sec
//   swell  = 8 bars  = 29.09 sec (long synth pad rise/fall)
// Each call to beatClock(playhead) returns one BEAT object reused everywhere.
// ───────────────────────────────────────────────────────────
const BPM=66;
const BEAT_SEC = 60/BPM;
const BAR_SEC  = BEAT_SEC*4;
const PHRASE_SEC = BAR_SEC*4;
const SWELL_SEC  = BAR_SEC*8;

const BEAT={beatIdx:0,beatPhase:0,beatPulse:0,barIdx:0,barPhase:0,barPulse:0,
            phraseIdx:0,phrasePhase:0,swellPhase:0,swell:0,droneA:0,droneB:0,
            beatNum:0 /* 0..3 within bar */, barNum:0, phrasePulse:0, halfBarPulse:0};

function beatClock(ph){
  BEAT.beatIdx   = Math.floor(ph/BEAT_SEC);
  BEAT.beatPhase = (ph % BEAT_SEC) / BEAT_SEC;          // 0..1 inside beat
  // sharp attack, fast decay — like a kick
  BEAT.beatPulse = Math.exp(-BEAT.beatPhase*7);
  BEAT.barIdx    = Math.floor(ph/BAR_SEC);
  BEAT.barPhase  = (ph % BAR_SEC) / BAR_SEC;
  BEAT.barPulse  = Math.exp(-BEAT.barPhase*3.2);        // wider envelope per bar
  BEAT.beatNum   = BEAT.beatIdx % 4;
  BEAT.barNum    = BEAT.barIdx % 4;        // 0..3 within phrase
  BEAT.phraseIdx = Math.floor(ph/PHRASE_SEC);
  BEAT.phrasePhase = (ph % PHRASE_SEC) / PHRASE_SEC;
  BEAT.phrasePulse = Math.exp(-BEAT.phrasePhase*1.4); // big swell every 4 bars
  // off-beat (and-of-2/3) accent
  const halfBarPh = (ph % (BAR_SEC*.5)) / (BAR_SEC*.5);
  BEAT.halfBarPulse = Math.exp(-halfBarPh*5);
  // Swell: slow attack/decay over 8 bars
  BEAT.swellPhase = (ph % SWELL_SEC) / SWELL_SEC;
  BEAT.swell = .5 - .5*Math.cos(BEAT.swellPhase*Math.PI*2);  // 0..1..0
  // Two slow drones, beat-locked, slightly detuned
  BEAT.droneA = .5 + .5*Math.sin(ph*Math.PI*2/BAR_SEC*.25);  // ~one cycle per 4 bars
  BEAT.droneB = .5 + .5*Math.sin(ph*Math.PI*2/BAR_SEC*.41 + .7);
}

// ───────────────────────────────────────────────────────────
// LIVE SYNTH SCORE — drone hymnal, generated in WebAudio
// Sub-bass kick on every beat, sustained pad with chord per scene,
// bell on bar 1, reverb tail. No external files.
// ───────────────────────────────────────────────────────────
const Note={D2:73.42, E2:82.41, F2:87.31, A2:110.0,
            D3:146.83, E3:164.81, F3:174.61, G3:196.0, Ab3:207.65, A3:220.0,
            Bb3:233.08, B3:246.94, C4:261.63, Db4:277.18, D4:293.66,
            E4:329.63, F4:349.23, Fs4:369.99, G4:392.0, A4:440.0, B4:493.88,
            D5:587.33, E5:659.25};
// Per-scene musical intensity: arpeggio? hi-hat? pad-volume multiplier? lead on phrase?
const SCENE_INTENSE = {
  creation:   {arp:[Note.D4,Note.F4,Note.Ab3,Note.A3],         hat:true,  pad:1.0, lead:Note.D5},
  kolob:      {arp:[Note.D4,Note.F4,Note.A4,Note.D5],          hat:true,  pad:1.15,lead:Note.D5},
  worlds:     {arp:[Note.A3,Note.E4,Note.A4,Note.E4],          hat:true,  pad:.95, lead:Note.A4},
  threeSuns:  {arp:[Note.D4,Note.F4,Note.A4,Note.F4],          hat:true,  pad:1.1, lead:Note.D5},
  twelve:     {arp:[Note.F4,Note.A4,Note.C4,Note.A4],          hat:true,  pad:1.0, lead:0},
  garden:     {arp:[Note.G3,Note.B3,Note.D4,Note.G4],          hat:false, pad:.95, lead:Note.G4},
  trees:      {arp:[Note.E3,Note.G3,Note.B3,Note.E4],          hat:true,  pad:1.0, lead:Note.B4},
  telestial:  {arp:null,                                       hat:false, pad:.55, lead:0},
  terrestrial:{arp:[Note.F3,Note.A3,Note.C4,Note.F4],          hat:true,  pad:1.0, lead:Note.F4},
  veil:       {arp:[Note.D4,Note.A4,Note.D5,Note.A4],          hat:true,  pad:1.1, lead:Note.D5},
  holdKolob:  {arp:null,                                       hat:false, pad:.55, lead:0}
};
const SCENE_CHORDS = {
  creation:   {root: Note.D2, pad:[Note.D3, Note.F3, Note.Ab3, Note.A3], drive:.85, kick:.7},
  kolob:      {root: Note.D2, pad:[Note.D3, Note.A3, Note.F4, Note.D5], drive:.95, kick:1.0},
  worlds:     {root: Note.A2, pad:[Note.A2, Note.E4, Note.A3], drive:.7, kick:.7},
  threeSuns:  {root: Note.D2, pad:[Note.D3, Note.F3, Note.A3, Note.D4], drive:.85, kick:.85},
  twelve:     {root: Note.F3, pad:[Note.F3, Note.A3, Note.C4, Note.F4], drive:.75, kick:.7},
  garden:     {root: Note.G3, pad:[Note.G3, Note.B3, Note.D4, Note.G4], drive:.75, kick:.55},
  trees:      {root: Note.E3, pad:[Note.E3, Note.G3, Note.B3, Note.E4], drive:.85, kick:.8},
  telestial:  {root: Note.D2, pad:[Note.D3, Note.F3, Note.Ab3, Note.Bb3], drive:.75, kick:.55},
  terrestrial:{root: Note.F2, pad:[Note.F3, Note.A3, Note.C4, Note.F4], drive:.95, kick:.9},
  veil:       {root: Note.D2, pad:[Note.D3, Note.A3, Note.D4], drive:1.0, kick:.85},
  holdKolob:  {root: Note.D2, pad:[Note.D3, Note.A3], drive:.55, kick:.3}
};

// Playback state — hoisted so toggleSound() never hits a TDZ on click
let playhead=0;
let paused=false;
let loopProgram=true;

let audioCtx=null, audioActive=false, audioStartT=0;
let masterOut=null, reverbIn=null, padOut=null, padNodes=[];
let lastBeatScheduled=-1;
let currentPadKey=null;

function ensureAudioGraph(){
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  // Master out + simple convolver reverb
  masterOut=audioCtx.createGain(); masterOut.gain.value=0.55;
  const compr=audioCtx.createDynamicsCompressor();
  compr.threshold.value=-14; compr.ratio.value=3; compr.attack.value=.005; compr.release.value=.18;
  masterOut.connect(compr); compr.connect(audioCtx.destination);
  // Reverb send
  reverbIn=audioCtx.createGain(); reverbIn.gain.value=.35;
  const conv=audioCtx.createConvolver();
  const len=audioCtx.sampleRate*2.6, ir=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=ir.getChannelData(ch); let prev=0;
    for(let i=0;i<len;i++){
      const n=Math.random()*2-1;
      const a=.3+.69*(i/len); prev=prev*a+n*(1-a);
      d[i]=prev*Math.pow(1-i/len,2.3);
    }
  }
  // normalize
  let mx=0; for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch); for(let i=0;i<len;i++) if(Math.abs(d[i])>mx) mx=Math.abs(d[i])}
  if(mx>0) for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]/=mx}
  conv.buffer=ir;
  const verbWet=audioCtx.createGain(); verbWet.gain.value=1.0;
  reverbIn.connect(conv); conv.connect(verbWet); verbWet.connect(masterOut);
}

function scheduleKick(T, gain){
  const osc=audioCtx.createOscillator(), env=audioCtx.createGain();
  const click=audioCtx.createOscillator(), clickEnv=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(95, T);
  osc.frequency.exponentialRampToValueAtTime(38, T+.18);
  env.gain.setValueAtTime(0,T);
  env.gain.linearRampToValueAtTime(.85*gain, T+.004);
  env.gain.exponentialRampToValueAtTime(.0001, T+.55);
  osc.connect(env); env.connect(masterOut);
  // click transient (noise burst)
  click.type='triangle';
  click.frequency.setValueAtTime(180,T);
  click.frequency.exponentialRampToValueAtTime(60,T+.04);
  clickEnv.gain.setValueAtTime(.3*gain,T);
  clickEnv.gain.exponentialRampToValueAtTime(.001,T+.06);
  click.connect(clickEnv); clickEnv.connect(masterOut);
  osc.start(T); osc.stop(T+.6);
  click.start(T); click.stop(T+.1);
}
// ── Arpeggiator — 4 sixteenth notes per beat, for dynamic scenes
function scheduleArp(T_beat, notes, gain){
  const subDur = BEAT_SEC/4;
  notes.forEach((f,i)=>{
    const T = T_beat + i*subDur;
    const o=audioCtx.createOscillator(), e=audioCtx.createGain();
    const filt=audioCtx.createBiquadFilter();
    o.type='square'; o.frequency.value=f;
    filt.type='lowpass'; filt.frequency.value=1800; filt.Q.value=4;
    e.gain.setValueAtTime(0,T);
    e.gain.linearRampToValueAtTime(.07*gain, T+.004);
    e.gain.exponentialRampToValueAtTime(.0001, T+subDur*.9);
    o.connect(filt); filt.connect(e); e.connect(masterOut); e.connect(reverbIn);
    o.start(T); o.stop(T+subDur+.02);
  });
}
// ── Hi-hat noise burst — for off-beats during energetic scenes
let _hatBuf=null;
function getHatBuf(){
  if(_hatBuf) return _hatBuf;
  const len=.06*audioCtx.sampleRate|0;
  _hatBuf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=_hatBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1);
  return _hatBuf;
}
function scheduleHat(T, gain){
  const src=audioCtx.createBufferSource(); src.buffer=getHatBuf();
  const filt=audioCtx.createBiquadFilter(); filt.type='highpass'; filt.frequency.value=7000; filt.Q.value=1;
  const env=audioCtx.createGain();
  env.gain.setValueAtTime(0,T);
  env.gain.linearRampToValueAtTime(.16*gain,T+.002);
  env.gain.exponentialRampToValueAtTime(.0001,T+.05);
  src.connect(filt); filt.connect(env); env.connect(masterOut);
  src.start(T); src.stop(T+.08);
}
// ── Lead — single bright sine on phrase boundaries, for moments of awe
function scheduleLead(T, freq, gain){
  const o=audioCtx.createOscillator(), e=audioCtx.createGain();
  o.type='triangle'; o.frequency.value=freq;
  e.gain.setValueAtTime(0,T);
  e.gain.linearRampToValueAtTime(.10*gain, T+.04);
  e.gain.exponentialRampToValueAtTime(.0001, T+2.5);
  o.connect(e); e.connect(reverbIn); e.connect(masterOut);
  o.start(T); o.stop(T+2.8);
}
function scheduleBell(T, freq, gain){
  const tones=[1, 2.01, 3.02, 4.21];   // inharmonic for bell character
  tones.forEach((m,i)=>{
    const o=audioCtx.createOscillator(), e=audioCtx.createGain();
    o.type='sine'; o.frequency.value=freq*m;
    const g=gain*Math.pow(.45,i);
    e.gain.setValueAtTime(0,T);
    e.gain.linearRampToValueAtTime(g, T+.005);
    e.gain.exponentialRampToValueAtTime(.0001, T+3.0+i*.4);
    o.connect(e); e.connect(reverbIn); e.connect(masterOut);
    o.start(T); o.stop(T+3.5);
  });
}
function killPad(){
  if(!padOut) return;
  const now=audioCtx.currentTime;
  padOut.gain.cancelScheduledValues(now);
  padOut.gain.setValueAtTime(padOut.gain.value, now);
  padOut.gain.linearRampToValueAtTime(0, now+.6);
  const old=padOut, oldNodes=padNodes;
  setTimeout(()=>{oldNodes.forEach(n=>{try{n.stop()}catch(e){}})}, 700);
  padOut=null; padNodes=[];
}
function startPad(freqs, drive){
  killPad();
  const now=audioCtx.currentTime;
  padOut=audioCtx.createGain(); padOut.gain.value=0;
  padOut.gain.linearRampToValueAtTime(.15*drive, now+1.2);
  const filt=audioCtx.createBiquadFilter();
  filt.type='lowpass'; filt.frequency.value=380; filt.Q.value=1.2;
  // LFO on filter cutoff — slow swell
  const lfo=audioCtx.createOscillator(), lfoGain=audioCtx.createGain();
  lfo.frequency.value=1/29.09; // 8-bar swell
  lfoGain.gain.value=420;
  lfo.connect(lfoGain); lfoGain.connect(filt.frequency);
  lfo.start();
  freqs.forEach(f=>{
    const o1=audioCtx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=f;
    const o2=audioCtx.createOscillator(); o2.type='sawtooth'; o2.frequency.value=f*1.006;
    const o3=audioCtx.createOscillator(); o3.type='sine';     o3.frequency.value=f*.5; // sub
    const sub=audioCtx.createGain(); sub.gain.value=.45;
    o1.connect(filt); o2.connect(filt); o3.connect(sub); sub.connect(filt);
    o1.start(); o2.start(); o3.start();
    padNodes.push(o1,o2,o3);
  });
  padNodes.push(lfo);
  const padSend=audioCtx.createGain(); padSend.gain.value=.55;
  filt.connect(padOut); padOut.connect(masterOut);
  filt.connect(padSend); padSend.connect(reverbIn);
}
function setSceneChord(sceneKey){
  if(!audioActive) return;
  if(sceneKey===currentPadKey) return;
  const ch=SCENE_CHORDS[sceneKey];
  const ix=SCENE_INTENSE[sceneKey] || {pad:1.0};
  if(!ch) return;
  startPad(ch.pad, ch.drive * (ix.pad||1.0));
  currentPadKey=sceneKey;
}
function audioPlayheadTime(){
  return audioActive ? (audioCtx.currentTime - audioStartT) : null;
}
function showMsg(txt,err){
  const m=document.getElementById('sndMsg');
  m.textContent=txt; m.style.display='block';
  m.style.color = err ? '#ff7777' : '#7fffaa';
  if(!err) setTimeout(()=>{if(m.textContent===txt)m.style.display='none'},3500);
}
function toggleSound(){
  const btn=document.getElementById('sndBtn');

    ensureAudioGraph();
    if(audioCtx.state==='suspended'){
      audioCtx.resume().then(()=>showMsg('audio context resumed · '+audioCtx.state));
    }
    if(audioActive){
      audioActive=false; killPad(); currentPadKey=null;
      btn.classList.remove('on'); btn.textContent='♪ START SCORE';
      showMsg('score stopped');
    } else {
      audioActive=true;
      audioStartT = audioCtx.currentTime - (loopProgram ? (playhead%TOTAL_DUR) : playhead);
      lastBeatScheduled=-1;
      // Force-trigger immediate scene chord so we get sound right away
      const phMod = loopProgram ? (playhead%TOTAL_DUR) : Math.min(playhead, TOTAL_DUR-.01);
      const sc = PROGRAM[findScene(phMod)];
      setSceneChord(sc.scene);
      // Schedule a confirmation kick RIGHT NOW so user hears something within ~50ms
      scheduleKick(audioCtx.currentTime + .03, .9);

      showMsg('score running · ctx '+audioCtx.state+' · ch '+sc.scene);

    btn.classList.add('err'); btn.textContent='✕ ERROR';

}
window.toggleSound=toggleSound;
function tickAudioScheduler(){
  if(!audioActive || !audioCtx) return;
  const lookahead=.20; // schedule 200ms ahead
  const now=audioCtx.currentTime;
  // Determine current beat index from audio clock
  const ph = now - audioStartT;
  // Schedule any beats whose scheduled time falls between now and now+lookahead
  // beatIdx N occurs at audioStartT + N*BEAT_SEC
  let nextBeatIdx = Math.max(lastBeatScheduled+1, Math.floor(ph/BEAT_SEC));
  while(true){
    const beatTime = audioStartT + nextBeatIdx*BEAT_SEC;
    if(beatTime > now + lookahead) break;
    if(beatTime < now - .05){ nextBeatIdx++; continue; }
    const beatNum = nextBeatIdx % 4;
    // Find scene at this beat time
    const sceneIdx = findScene((beatTime - audioStartT) % TOTAL_DUR);
    const sc = PROGRAM[sceneIdx];
    const ch = SCENE_CHORDS[sc.scene] || SCENE_CHORDS.cloud;
    const ix = SCENE_INTENSE[sc.scene] || SCENE_INTENSE.cloud;
    // Kick on every beat, accent on beat 1
    const kg = (beatNum===0 ? 1.0 : .6) * ch.kick;
    scheduleKick(beatTime, kg);
    // Arp — 4 sixteenths per beat, rotated per beat for variety
    if(ix.arp){
      const arpNotes = ix.arp.map((_,i)=>ix.arp[(i+beatNum)%ix.arp.length]);
      scheduleArp(beatTime, arpNotes, .85);
    }
    // Hi-hat — on the "and" of each beat, slightly louder on the 4 (push to next beat)
    if(ix.hat){
      const hatT = beatTime + BEAT_SEC*.5;
      scheduleHat(hatT, beatNum===3 ? 1.0 : .65);
    }
    // Bell on bar-1 of every 2nd bar during dramatic scenes
    const barIdx = Math.floor(nextBeatIdx/4);
    if(beatNum===0 && barIdx%2===0 && (sc.scene==='kolob'||sc.scene==='fire'||sc.scene==='figure'||sc.scene==='holdKolob')){
      scheduleBell(beatTime, ch.root*4, .25);
    }
    // Lead — every phrase boundary (every 16 beats), held high note
    if(beatNum===0 && barIdx%4===0 && ix.lead){
      scheduleLead(beatTime, ix.lead, .9);
    }
    lastBeatScheduled = nextBeatIdx;
    nextBeatIdx++;
  }
}

// Scenes registry (functions assigned below; consumed by evalProgram)
const Scenes = {};

// 1) CREATION — spiral / black hole vortex pulling particles inward
Scenes.creation = (v,t,localT)=>{
  const r = Math.sqrt(v.nx*v.nx + v.nz*v.nz);
  const theta = Math.atan2(v.nz, v.nx);
  // Two-arm logarithmic spiral wrapping inward
  const armPhase = theta*2 + Math.log(r+.04)*4.5 - t*.65;
  const armWidth = .25;
  const arm = Math.exp(-Math.pow(((armPhase%(Math.PI*2)+Math.PI*2)%(Math.PI*2)) - Math.PI, 2)/armWidth);
  // Vertical falloff so arms span the column but center is densest
  const heightFalloff = 1 - Math.abs(v.ny)*.35;
  // Inner accretion ring at varying Y — kicked outward on beat then sucked back
  const ringR = .12 + BEAT.beatPulse*.04;
  const ring = Math.exp(-Math.pow((r-ringR)/.025,2)) * Math.exp(-Math.pow(v.ny/.85,2)*.6);
  // Event horizon — pure black core
  if(r<.07 && Math.abs(v.ny)<.15) return [0,0,0];
  // Falling particles: discrete shells of particles being pulled in (one per beat)
  let infall=0;
  for(let s=0;s<4;s++){
    const age = (BEAT.beatIdx-s) + BEAT.beatPhase;
    if(age<0||age>4) continue;
    const shellR = .85 * Math.exp(-age*.45);
    const angOff = age*1.8;
    const armMatch = Math.exp(-Math.pow(Math.sin(theta+angOff)*.5,2)*8);
    infall += Math.exp(-Math.pow((r-shellR)/.05,2)) * armMatch * (1-age/4) * .8;
  }
  const sum = arm*heightFalloff*(.4 + .5/Math.max(.10,r)) + ring*1.3 + infall;
  if(sum<.10) return [0,0,0];
  // Color: violet/blue at outer, white-hot at horizon
  const hue = (.62 - r*.35 + Math.sin(t*.3)*.04 + 1)%1; // .27(outer warm)→.62(deep blue)
  const lit = .50 + (1-r)*.20;
  const [cr,cg,cb] = hsl2rgb(hue, .85, lit);
  // Ring + infall punch white
  const whiteHot = (ring + infall*.3) * 1.2;
  return [(sum*cr + whiteHot)*1.5, (sum*cg + whiteHot*.85)*1.5, (sum*cb + whiteHot)*1.5];
};

// 2) Kolob — multi-color sun with corona shockwaves, sunburst rays,
//    chromatic ring storms on phrases. Hue cycles per bar.
Scenes.kolob = (v,t,localT)=>{
  const r = Math.sqrt(v.nx*v.nx + v.ny*v.ny + v.nz*v.nz);
  const theta = Math.atan2(v.nz, v.nx);
  // Core throbs with kick
  const coreSize = .14 + BEAT.beatPulse*.10;
  const core = expBell(r/coreSize, 1.0) * (1.2 + BEAT.beatPulse*1.1);
  // Sunburst rays — 8 spokes rotating with the bar
  const rayN=8, rayPhase=BEAT.barPhase*Math.PI*2 + t*.4;
  const rayAng=((theta-rayPhase) % (Math.PI*2/rayN) + Math.PI*2/rayN) % (Math.PI*2/rayN);
  const raySharp=Math.exp(-Math.pow((rayAng - Math.PI/rayN)/(.10+BEAT.beatPulse*.05),2)*8);
  const rayLen=expBell((r-.5)/.30, 1.0);
  const rays = raySharp * rayLen * (.4 + BEAT.beatPulse*.55);
  // Two corona shockwave rings (different speeds)
  const r1 = .30 + BEAT.barPhase*.60;
  const r2 = .20 + BEAT.phrasePhase*1.30;
  const ring1 = expBell((r-r1)/.07, 1.0) * (1 - BEAT.barPhase) * 1.1;
  const ring2 = expBell((r-r2)/.05, 1.0) * (1 - BEAT.phrasePhase) * .85;
  // Phrase chromatic flare — radial pulse with rotating color
  const flare = (BEAT.barNum===0 ? BEAT.phrasePulse : 0) * expBell(r/.55, 1.0) * .7;
  const sum = core + rays + ring1 + ring2 + flare;
  if(sum<.08) return [0,0,0];
  // Hue cycles gold→orange→white over each bar; rings carry complementary chroma
  const baseHue = .12 + .03*Math.sin(BEAT.barPhase*Math.PI*2);   // gold zone
  const ringHueShift = .65 * (1 - BEAT.barPhase);               // ring carries cyan→gold
  const flareHue = (.5 + BEAT.phraseIdx*.13) % 1;
  let [r_,g_,b_]=hsl2rgb(baseHue, .85, .50);
  // Mix in ring hue
  const rmix = (ring1+ring2)/Math.max(.01,sum);
  const [rr,rg,rb] = hsl2rgb((baseHue+ringHueShift)%1, .85, .55);
  r_ = r_*(1-rmix)+rr*rmix;
  g_ = g_*(1-rmix)+rg*rmix;
  b_ = b_*(1-rmix)+rb*rmix;
  // Flare splash
  if(flare>.05){
    const [fr,fg,fb]=hsl2rgb(flareHue, .9, .6);
    const fmix = flare*1.4;
    r_=r_+fr*fmix; g_=g_+fg*fmix; b_=b_+fb*fmix;
  }
  const v_=sum;
  return [v_*r_*1.8, v_*g_*1.8, v_*b_*1.8];
};

// 3) 144 Worlds · 15 Sealed — particle field
Scenes._worldsPts = null;
function ensureWorldsPts(){
  if(Scenes._worldsPts) return;
  const pts=[];
  let rng=12345;
  const R=()=>(rng=(rng*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<144;i++){
    const sealed=i<15;
    const r = sealed?(.05+R()*.25):(.3+R()*.85);
    const a=R()*Math.PI*2;
    // Each world gets a unique hue (rainbow spread for outer, gold for sealed)
    const hue = sealed ? (.10+R()*.06) : R();
    pts.push({x:Math.cos(a)*r, y:(R()*2-1)*.92, z:Math.sin(a)*r, sealed, ph:R()*Math.PI*2, hue});
  }
  Scenes._worldsPts=pts;
}
Scenes.worlds = (v,t,localT)=>{
  ensureWorldsPts();
  // Multicolor swarm. Each world has its own hue. Sealed core glows gold.
  // Phrase boundary: all 144 simultaneously flash white.
  const sealedKick = .55 + BEAT.beatPulse*1.1 + BEAT.halfBarPulse*.3;
  const outerJit   = .020 + BEAT.barPulse*.05;
  const sealEvent  = (BEAT.barNum===0 ? BEAT.phrasePulse : 0);
  let r=0,g=0,b=0;
  for(const p of Scenes._worldsPts){
    const amp = p.sealed?outerJit*.4:outerJit;
    const px=p.x+Math.sin(t*1.1+p.ph)*amp;
    const py=p.y+Math.cos(t*.95+p.ph)*amp;
    const pz=p.z+Math.cos(t*1.05+p.ph)*amp;
    const d=Math.sqrt((v.nx-px)*(v.nx-px)+(v.ny-py)*(v.ny-py)+(v.nz-pz)*(v.nz-pz));
    let weight;
    if(p.sealed) weight = sealedKick + sealEvent*1.2;
    else weight = .35 + BEAT.halfBarPulse*.4 + sealEvent*.9;
    const w=Math.exp(-(d*d)/.0035)*weight;
    // Apply this world's color, with sealed worlds biased gold
    const hueShift = BEAT.phrasePhase*.1;
    const sat = p.sealed?.65:.85;
    const [cr,cg,cb]=hsl2rgb((p.hue+hueShift)%1, sat, p.sealed?.65:.55);
    r += w*cr; g += w*cg; b += w*cb;
  }
  // Phrase white-out adds achromatic flash
  r += sealEvent*.3; g += sealEvent*.3; b += sealEvent*.3;
  if(Math.max(r,g,b)<.08) return [0,0,0];
  return [r*1.4, g*1.4, b*1.4];
};

// 4) THREE GREAT SUNS — 3 large stacked spheres (kolob's three kingdoms)
//    Bottom = cyan telestial, middle = magenta terrestrial, top = gold celestial.
//    Each breathes, swirls internally, fires on its own beat in the bar.
const THREE_SUNS = [
  {y:-.62, R:.30, hue:.52, sat:.65, lit:.55, name:'telestial-cyan'},
  {y: 0.0,  R:.34, hue:.92, sat:.70, lit:.60, name:'terrestrial-magenta'},
  {y: 0.62, R:.30, hue:.12, sat:.75, lit:.58, name:'celestial-gold'}
];
Scenes.threeSuns_old = null;
Scenes.threeSuns = (v,t,localT)=>{
  let r=0,g=0,b=0;
  // Phrase event: connecting beam through all three suns (axis-mundi flash)
  const axisPulse = (BEAT.barNum===0 ? BEAT.phrasePulse : 0);
  const axisCol = Math.exp(-Math.pow(Math.sqrt(v.nx*v.nx+v.nz*v.nz)/.04,2)) * axisPulse * .9;
  for(let i=0;i<THREE_SUNS.length;i++){
    const s = THREE_SUNS[i];
    // Each sun breathes with the bar
    const breathR = s.R + Math.sin(t*.8+i*1.3)*.012 + BEAT.barPulse*.025;
    const dx=v.nx, dy=v.ny-s.y, dz=v.nz;
    const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
    // Internal swirl: angular pattern rotating around sphere's own axis
    const theta = Math.atan2(dz,dx);
    const phi = Math.atan2(dy, Math.sqrt(dx*dx+dz*dz));
    const swirl = .80 + .20*Math.sin(theta*4 + phi*3 + t*1.6 + i*2.1);
    // Beat: this sun flashes when (beatNum % 3) == i (polyrhythmic)
    const isMine = (BEAT.beatNum%3)===i;
    const flare = isMine ? (1.0 + BEAT.beatPulse*1.3) : (.78 + BEAT.barPulse*.18);
    // Core: bell function for spherical glow
    const core = expBell(d/breathR, 1.0) * swirl * flare;
    // Halo: thin shell just outside surface — pulses on beat
    const halo = Math.exp(-Math.pow((d-breathR-.04)/.025,2)) * (.4 + BEAT.beatPulse*.55);
    const intensity = core + halo;
    if(intensity < .04) continue;
    const [cr,cg,cb] = hsl2rgb((s.hue + Math.sin(t*.15+i)*.02)%1, s.sat, s.lit);
    r += intensity*cr; g += intensity*cg; b += intensity*cb;
  }
  // Axis-mundi connector
  r += axisCol*.95; g += axisCol*.90; b += axisCol*1.0;
  if(Math.max(r,g,b)<.08) return [0,0,0];
  return [r*1.7, g*1.7, b*1.7];
};

    }
  }
  const total=Math.max(r,g,b);
  if(total<.1) return [0,0,0];
  return [r+hotR*.4, g+hotG*.4+allFlash*.2, b+hotB*.4];
};

// 6) Time Collapse — particles converge to single point (one Kolob day)
Scenes._collapsePts=null;
function ensureCollapsePts(){
  if(Scenes._collapsePts) return;
  const pts=[];
  let rng=99887;
  const R=()=>(rng=(rng*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<90;i++){
    const a=R()*Math.PI*2;
    const r=.4+R()*.65;
    pts.push({sx:Math.cos(a)*r, sy:(R()*2-1)*.95, sz:Math.sin(a)*r});
  }
  Scenes._collapsePts=pts;
}
Scenes.collapse = (v,t,localT,dur)=>{
  ensureCollapsePts();
  const totalBars = Math.max(1, Math.floor(dur/BAR_SEC));
  const barInScene = Math.min(totalBars, Math.floor(localT/BAR_SEC));
  const barProg = clamp01((localT - barInScene*BAR_SEC)/BAR_SEC);
  const stepA = barInScene/totalBars, stepB = Math.min(1,(barInScene+1)/totalBars);
  const ease = stepA + (stepB-stepA) * (1 - Math.pow(1-barProg, 3));
  const collapse = Math.pow(ease, 1.4);
  // Spiraling collapse: rotation accelerates as particles fall inward
  const spin = ease*Math.PI*4 + t*.5;
  const c=Math.cos(spin), s=Math.sin(spin);
  const kickPull = BEAT.beatPulse*.04;
  // Phrase event: brief outward EXPLOSION before re-collapsing
  const explode = (BEAT.barNum===0 ? BEAT.phrasePulse : 0) * .5;
  // Chromatic aberration: RGB channels sample at slightly different radii on beats
  const chroma = BEAT.beatPulse*.05;
  let valR=0,valG=0,valB=0;
  for(const p of Scenes._collapsePts){
    const radius=(1 - collapse - kickPull + explode);
    // rotated XZ positions
    const rx = (p.sx*c - p.sz*s) * radius;
    const rz = (p.sx*s + p.sz*c) * radius;
    const py = p.sy*radius;
    for(let ch=0;ch<3;ch++){
      const cAdj = (ch-1)*chroma;
      const dx = v.nx-rx*(1+cAdj), dy = v.ny-py, dz = v.nz-rz*(1+cAdj);
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      const w=Math.exp(-(d*d)/.005)*(.5+ease*.9 + BEAT.beatPulse*.4 + explode*1.4);
      if(ch===0) valR+=w; else if(ch===1) valG+=w; else valB+=w;
    }
  }
  if(Math.max(valR,valG,valB)<.1) return [0,0,0];
  // Hue cycles cool→warm as collapse intensifies (terror of singularity)
  const hue = (.55 - ease*.35 + BEAT.phrasePhase*.1 + 1) % 1;
  const [hr,hg,hb] = hsl2rgb(hue, .85, .55);
  return [valR*hr*1.5, valG*hg*1.5, valB*hb*1.5];
};

// 7) Jacob's Ladder — rungs climb per beat, each its own color climbing
//    through the spectrum. Sparks travel between rails. Rails glow on bar.
Scenes.ladder = (v,t,localT)=>{
  const railLit = .35 + BEAT.barPulse*.4;
  const railOn = (Math.abs(Math.abs(v.nx)-.55)<.09 && Math.abs(v.nz)<.4) ? railLit : 0;
  let rungVal=0, rungHue=0;
  const NUM_RUNGS=8;
  for(let r=0;r<NUM_RUNGS;r++){
    const yPos = -.95 + r*(1.9/NUM_RUNGS);
    const isNew = (r===0);
    const rungWidth=.10 + (isNew?BEAT.beatPulse*.05:0);
    const inRung = (Math.abs(v.ny-yPos)<rungWidth && Math.abs(v.nx)<.6 && Math.abs(v.nz)<.4);
    if(inRung){
      const fade = 1 - r/(NUM_RUNGS+1);
      const flash = isNew ? (.8+BEAT.beatPulse*.8) : fade*.85;
      if(flash>rungVal){
        rungVal=flash;
        // hue cycles as rung climbs (newest = warm, oldest = cool)
        rungHue = (r/NUM_RUNGS + BEAT.phraseIdx*.13) % 1;
      }
    }
  }
  // Lateral spark — travels between rails on each beat
  const sparkX = -.55 + Math.cos(BEAT.beatPhase*Math.PI)*1.1;   // sweeps L→R
  const sparkY = -.95 + (BEAT.beatIdx%NUM_RUNGS)*(1.9/NUM_RUNGS); // at the newest rung Y
  const sparkD = Math.sqrt((v.nx-sparkX)*(v.nx-sparkX) + (v.ny-sparkY)*(v.ny-sparkY) + v.nz*v.nz);
  const spark = Math.exp(-Math.pow(sparkD/.07,2)) * (1-BEAT.beatPhase) * 1.0;
  const total = Math.max(railOn, rungVal, spark);
  if(total<.1) return [0,0,0];
  // Color the rung
  let cr=.7,cg=.85,cb=1.0;  // default rail blue-white
  if(rungVal>railOn){
    const [r_,g_,b_]=hsl2rgb(rungHue, .75, .58);
    cr=r_; cg=g_; cb=b_;
  }
  if(spark>railOn && spark>rungVal){
    cr=1.0; cg=.95; cb=.6;  // spark = yellow-white
  }
  return [total*cr*1.4, total*cg*1.4, total*cb*1.4];
};

// 8) Standing Figure of Light — chest heartbeat, aura waves outward,
//    chromatic halo with hue rotation, phrase = full white-out resolution.
Scenes.figure = (v,t,localT)=>{
  const chestPulse = BEAT.beatPulse;
  const headPulse = BEAT.barPulse*.4;
  const head=expBell(v.nx/.18,1)*expBell((v.ny-.75)/(.13+headPulse*.04),1)*expBell(v.nz/.55,1)*(1.0+headPulse*.4);
  const heartRing = expBell((v.ny-.2)/(.10+chestPulse*.06), 1.0);
  const torsoMask=(Math.abs(v.nx)<.30 && v.ny>-.45 && v.ny<.55 && Math.abs(v.nz)<.32);
  const torsoFall=expBell((v.ny+.05)/.55,1);
  const torso = torsoMask ? (.75 + heartRing*chestPulse*.9) * torsoFall : 0;
  const legs=(Math.abs(Math.abs(v.nx)-.12)<.10 && v.ny<-.4 && v.ny>-.95 && Math.abs(v.nz)<.25) ?
    (.65 + BEAT.beatPulse*.25) : 0;
  const arms=(Math.abs(Math.abs(v.nx)-.38)<.08 && v.ny<.4 && v.ny>-.15 && Math.abs(v.nz)<.20) ?
    (.55 + BEAT.barPulse*.25) : 0;
  // Aura wave: radiates outward from chest every bar
  const auraR = Math.sqrt(v.nx*v.nx + (v.ny-.2)*(v.ny-.2) + v.nz*v.nz);
  const auraFront = BEAT.barPhase*.85;
  const aura = Math.exp(-Math.pow((auraR-auraFront)/.10,2)) * (1-BEAT.barPhase) * .5;
  // Halo around head — pulses with bar, hue rotates per phrase
  const haloR = Math.sqrt(v.nx*v.nx + (v.ny-.75)*(v.ny-.75) + v.nz*v.nz);
  const halo = expBell(haloR/(.30+BEAT.barPulse*.10), 1.0) * (BEAT.barPulse*.5 + .15);
  // Phrase resolution — figure becomes white & expanded
  const resolve = (BEAT.barNum===0 ? BEAT.phrasePulse : 0) * .9;
  const body = Math.max(head,torso,legs,arms) * (.85 + BEAT.swell*.2 + resolve*.5);
  const sum = body + halo + aura + resolve*.3;
  if(sum<.12) return [0,0,0];
  // Halo cycles hue per phrase (gold→blue→violet→white→gold)
  const haloHue = (BEAT.phraseIdx*.22 + BEAT.barPhase*.05) % 1;
  const [hr,hg,hb] = hsl2rgb(haloHue, .7, .6);
  // Body stays warm white but picks up halo tint
  const haloMix = (halo+aura)/Math.max(.01,sum);
  const r_ = .95 + (hr-.95)*haloMix*.8;
  const g_ = 1.0 + (hg-1.0)*haloMix*.8;
  const b_ = .85 + (hb-.85)*haloMix*.8;
  // Phrase resolution adds pure white
  return [sum*r_ + resolve*.6, sum*g_ + resolve*.6, sum*b_ + resolve*.6];
};

// 9) Pillar of Fire — multi-hue inferno: red/orange/yellow turbulence,
//    spiraling plumes, off-beat sparks, phrase blast becomes multicolored.
Scenes.fire = (v,t,localT)=>{
  const advect = BEAT.beatIdx*.5 + BEAT.beatPulse*.4;
  const f1 = Math.sin(v.ny*5 + advect*3 + Math.cos(v.nx*3-t*2.2)*1.4);
  const f2 = Math.sin(v.ny*8 - advect*4 + Math.sin(v.nz*4+t*1.6)*1.2);
  const f3 = Math.sin(v.nx*4 + v.nz*4 + t*3.0);                // adds cross-grain motion
  const f = (f1+f2+f3*.5)*.22 + .5;
  const radial = (1 - Math.sqrt(v.nx*v.nx+v.nz*v.nz)*(.55 - BEAT.beatPulse*.10));
  // Six spiraling plumes — each rotates as it climbs
  let plume=0, plumeColor=0;
  for(let p=0;p<6;p++){
    const plumeAge = (BEAT.beatIdx-p*.6) + BEAT.beatPhase;
    if(plumeAge<0||plumeAge>4) continue;
    const yPos = -1 + (plumeAge/4)*2.2;
    // Spiral around the column axis
    const spiralAng = plumeAge*Math.PI + p*1.04;
    const xOff = Math.cos(spiralAng)*.20*plumeAge;
    const zOff = Math.sin(spiralAng)*.20*plumeAge;
    const d = Math.sqrt((v.nx-xOff)*(v.nx-xOff)+(v.nz-zOff)*(v.nz-zOff)+(v.ny-yPos)*(v.ny-yPos));
    const w = Math.exp(-Math.pow(d/(.22+plumeAge*.05),2)*3.5) * (1-plumeAge/4);
    if(w>plume){plume=w; plumeColor=p/6;}
  }
  // Off-beat sparks — bright tips on the "and"
  const spark = BEAT.halfBarPulse * .4 * (Math.abs(v.nx)>.45||Math.abs(v.nz)>.45?1:0) * Math.random();
  const barFlare = (BEAT.beatNum===0 ? BEAT.beatPulse : 0) * .8;
  // Phrase blast — multicolored rising wave
  const phraseBlast = (BEAT.barNum===0 ? BEAT.phrasePulse : 0);
  const blastY = -1 + BEAT.phrasePhase*4;
  const blastShape = Math.exp(-Math.pow((v.ny-blastY)/.32,2)*3) * phraseBlast * 1.3;
  const sum = Math.max(0, radial) * (.45 + .55*f + barFlare + spark) * (.45 + plume*1.2) + blastShape;
  if(sum<.10) return [0,0,0];
  // Base hue: red at base → yellow at top, modulated by f and plume color
  const heightHue = .08 + (v.ny+1)*.5*.08;   // .08 (red-orange) → .16 (yellow-gold)
  const flickerHue = heightHue + f*.04 + plumeColor*.06;
  const blastHue = (BEAT.phraseIdx*.17 + .55) % 1; // wild color per phrase
  let [r,g,b] = hsl2rgb(flickerHue, .95, .55);
  // Blast splashes with a wild color
  if(blastShape>.05){
    const [br,bg,bb] = hsl2rgb(blastHue, .9, .65);
    const mix = blastShape*1.6;
    r += br*mix; g += bg*mix; b += bb*mix;
  }
  // Spark stays white-hot
  if(spark>.05){
    r += spark; g += spark*.8; b += spark*.5;
  }
  return [sum*r*1.6, sum*g*1.6, sum*b*1.6];
};

// ── THE GARDEN — paradisal green/blue field, mist + canopy + drifting fruit
Scenes.garden = (v,t,localT)=>{
  // Soft mist filling the lower half, gentle wave motion
  const mist = Math.exp(-Math.pow((v.ny+.4)/.55,2)) *
               (.45 + .25*Math.sin(v.nx*3+t*.5)*Math.cos(v.nz*3-t*.4));
  // Floating canopy at top: lush spherical cluster
  const cR = Math.sqrt(v.nx*v.nx + (v.ny-.55)*(v.ny-.55) + v.nz*v.nz);
  const canopy = expBell(cR/.42, 1.0) * (.55 + Math.sin(t*.6+v.ny*4)*.20);
  // Drifting orbs of fruit-light circling at canopy height
  let fruit=0, fruitFlash=0;
  for(let k=0;k<6;k++){
    const fa = k/6*Math.PI*2 + t*.22 + BEAT.barPhase*.4;
    const fy = .50 + Math.sin(t*.3+k*1.7)*.15;
    const fx = Math.cos(fa)*.32;
    const fz = Math.sin(fa)*.32;
    const fd = Math.sqrt((v.nx-fx)*(v.nx-fx)+(v.ny-fy)*(v.ny-fy)+(v.nz-fz)*(v.nz-fz));
    const w = Math.exp(-Math.pow(fd/.055,2));
    fruit = Math.max(fruit, w*(.65+.35*Math.sin(t*1.8+k)));
    if(w>fruitFlash) fruitFlash = w * BEAT.beatPulse * .6;
  }
  // Vine-like vertical streamers rising slowly
  const streamer = Math.exp(-Math.pow(Math.sin(v.nx*5+v.nz*5)*.3 - ((t*.4+v.ny*.7)%1)+.5,2)*4) * .15;
  const total = Math.max(mist, canopy*.85, fruit*1.2, streamer) + fruitFlash;
  if(total<.10) return [0,0,0];
  // Color: green-blue mist, gold fruit, teal canopy
  if(fruit>.4){
    const fh=(.12 + Math.sin(t*.3)*.04)%1;
    const [r_,g_,b_]=hsl2rgb(fh,.75,.60);
    return [total*r_*1.6+fruitFlash*.5, total*g_*1.6+fruitFlash*.5, total*b_*1.6+fruitFlash*.3];
  }
  const [r_,g_,b_] = hsl2rgb(.36 + Math.sin(t*.2+v.ny)*.05, .60, .48);
  return [total*r_*1.4, total*g_*1.4, total*b_*1.4];
};

// ── TREES OF KNOWLEDGE & LIFE — single tree, two crowns (lower red, upper white-gold)
Scenes.trees = (v,t,localT)=>{
  // Central trunk through the whole column
  const trunkOn = (Math.abs(v.nx)<.08 && Math.abs(v.nz)<.08);
  const trunk = trunkOn ? (.55 + Math.sin(t*.6+v.ny*5)*.10) : 0;
  // Lower crown — TREE OF KNOWLEDGE (red, more chaotic)
  const lowCR = Math.sqrt(v.nx*v.nx + (v.ny+.25)*(v.ny+.25) + v.nz*v.nz);
  const lowCanopy = expBell(lowCR/.22, 1.0) *
                    (.55 + Math.sin(t*1.2+v.nx*4+v.nz*4)*.20);
  // Upper crown — TREE OF LIFE (white/gold, radiant)
  const hiCR = Math.sqrt(v.nx*v.nx + (v.ny-.60)*(v.ny-.60) + v.nz*v.nz);
  const hiCanopy = expBell(hiCR/.28, 1.0) *
                   (.65 + Math.sin(t*.8+v.ny*3)*.15);
  // Knowledge fruit — 3 forbidden red orbs orbiting lower crown
  let lowFruit=0;
  for(let k=0;k<3;k++){
    const fa = k/3*Math.PI*2 + t*.28;
    const fy = -.25 + Math.sin(t*.5+k)*.06;
    const fd = Math.sqrt(Math.pow(v.nx-Math.cos(fa)*.17,2)+Math.pow(v.ny-fy,2)+Math.pow(v.nz-Math.sin(fa)*.17,2));
    lowFruit = Math.max(lowFruit, Math.exp(-Math.pow(fd/.055,2))*(.75+.25*Math.sin(t*2.2+k)));
  }
  // Life fruit — 5 white orbs orbiting upper crown
  let hiFruit=0;
  for(let k=0;k<5;k++){
    const fa = k/5*Math.PI*2 - t*.18;
    const fy = .60 + Math.sin(t*.4+k*1.3)*.08;
    const fd = Math.sqrt(Math.pow(v.nx-Math.cos(fa)*.22,2)+Math.pow(v.ny-fy,2)+Math.pow(v.nz-Math.sin(fa)*.22,2));
    hiFruit = Math.max(hiFruit, Math.exp(-Math.pow(fd/.05,2))*(.80+.20*Math.sin(t*2.6+k)));
  }
  // Tree of Life RAYS — on every bar, light radiates outward from upper crown
  const lifeRay = hiCanopy * (BEAT.barPulse*.7 + .15);
  // Phrase event: forbidden-fruit pulse all simultaneous
  const tempt = (BEAT.barNum===0 ? BEAT.phrasePulse : 0) * lowFruit * 1.5;
  const totalLow = Math.max(lowCanopy*.55, lowFruit*1.3) + tempt;
  const totalHi  = Math.max(hiCanopy*.7,  hiFruit*1.3) + lifeRay;
  const total = trunk*.55 + totalLow + totalHi;
  if(total<.08) return [0,0,0];
  // Color decisions
  if(lowFruit>.35 || tempt>.15){
    const [r_,g_,b_] = hsl2rgb(.02, .9, .55);   // forbidden red
    return [total*r_*1.5+tempt*.5, total*g_*1.3, total*b_*1.3];
  }
  if(hiFruit>.35 || lifeRay>.30){
    const [r_,g_,b_] = hsl2rgb(.13, .35, .70);  // life white-gold
    return [total*r_*1.6, total*g_*1.6, total*b_*1.5];
  }
  if(trunk>0 && Math.abs(v.ny)<.45){
    return [total*.50, total*.40, total*.25];   // brown trunk
  }
  // canopy default green
  const hue = v.ny>.3 ? .30 : .35;
  const [r_,g_,b_] = hsl2rgb(hue, .55, .45);
  return [total*r_*1.3, total*g_*1.3, total*b_*1.3];
};

// ── TELESTIAL KINGDOM — lone & dreary, desaturated grey-blue, fragmented
Scenes.telestial = (v,t,localT)=>{
  // Low ambient haze
  const ground = Math.exp(-Math.pow((v.ny+.7)/.5,2)) * .45;
  // Fragmented shards — broken vertical streaks that flicker
  const streakPhase = v.nx*4 + v.nz*4 + Math.sin(t*.3)*.5;
  const streak = Math.exp(-Math.pow(Math.sin(streakPhase)*.5+.5-.5,2)*8) *
                 Math.exp(-Math.pow(v.ny/.85,2)*.4) * .40;
  // Cold flickers — sporadic dim spikes at random positions per frame
  const cellHash = Math.sin((Math.floor(v.nx*10)+Math.floor(v.ny*10)*7+Math.floor(v.nz*10)*13)*9.7);
  const flicker = (Math.sin(t*4+cellHash*100)>.94) ? .35 : 0;
  // Slow ominous swell, one cycle per bar
  const pulse = .55 + BEAT.barPulse*.18 + Math.sin(BEAT.swellPhase*Math.PI*2)*.10;
  // Distant "preacher" point — single dim spot up & off-axis
  const preachD = Math.sqrt((v.nx-.4)*(v.nx-.4)+(v.ny-.55)*(v.ny-.55)+v.nz*v.nz);
  const preach = Math.exp(-Math.pow(preachD/.10,2)) * (.4 + .3*Math.sin(t*.8));
  const val = (ground + streak + flicker + preach*.6) * pulse;
  if(val<.07) return [0,0,0];
  // Desaturated cool slate
  const hue = .58 + Math.sin(t*.08)*.04;
  const [r_,g_,b_] = hsl2rgb(hue, .22, .42);
  // Preacher gets slight warmth
  if(preach>.25){
    return [val*r_*1.3+preach*.3, val*g_*1.2+preach*.20, val*b_*1.2+preach*.10];
  }
  return [val*r_*1.3, val*g_*1.3, val*b_*1.3];
};

// ── TERRESTRIAL KINGDOM — brighter, warm green-gold paradise with structure
Scenes.terrestrial = (v,t,localT)=>{
  // Upward-rolling waves of light
  const wavePh = ((v.ny+1)*.5 - ((t*.4 + v.nx*.08)%1) + 1)%1;
  const wave = Math.exp(-Math.pow(wavePh/.18,2)) * .55;
  // Stable luminous base
  const base = expBell((v.ny+.2)/.85, 1.0) * .50;
  // Crystalline structure — gentle hex-like grid
  const grid = (Math.abs(Math.sin(v.nx*7))*Math.abs(Math.sin(v.nz*7))*Math.abs(Math.sin(v.ny*7+t*.3))) * .35;
  // Beat: column-wide bloom
  const beatBloom = BEAT.beatPulse * Math.exp(-Math.sqrt(v.nx*v.nx+v.nz*v.nz)*1.0) * .35;
  // Phrase: golden swell rises through column
  const swellY = -1 + BEAT.phrasePhase*2.2;
  const phraseSwell = Math.exp(-Math.pow((v.ny-swellY)/.30,2)) * BEAT.phrasePulse * .55;
  const total = (base + wave + grid*.5) * (.75 + BEAT.barPulse*.25) + beatBloom + phraseSwell;
  if(total<.10) return [0,0,0];
  // Warm amber → green gradient over Y
  const hue = .14 + (v.ny+1)*.5*.10 + Math.sin(t*.2)*.03;
  const [r_,g_,b_] = hsl2rgb(hue, .65, .55);
  return [total*r_*1.5+phraseSwell*.3, total*g_*1.5+phraseSwell*.2, total*b_*1.5];
};

// ── VEIL + SYMBOLS — shimmering veil texture; sacred marks cycle through
//    every 2 bars: compass Λ → square L → navel • → knee —, fade in/out.
Scenes.veil = (v,t,localT)=>{
  // Shimmering veil backdrop — gentle white ripple
  const ripple = Math.exp(-Math.pow(Math.sin(v.ny*4+t*.6)*Math.cos(v.nx*3+t*.4),2)*1.5) * .28;
  // Symbol cycle — 2 bars (8 beats) per symbol; 4 symbols total = 8 bars per cycle
  const symBeats = 8;
  const symIdx = Math.floor(BEAT.beatIdx/symBeats) % 4;
  const symAgeBeats = (BEAT.beatIdx%symBeats) + BEAT.beatPhase;
  const symFadeIn  = Math.min(1, symAgeBeats/1.5);
  const symFadeOut = Math.max(0, Math.min(1, (symBeats-symAgeBeats)/1.5));
  const symFade = symFadeIn * symFadeOut;
  let sym=0;
  if(symIdx===0){
    // Compass Λ — two diagonals meeting at top
    const apexY = .35, slope = 1.4;
    const leftLine = v.nx<0 ? Math.abs(v.ny - (apexY + v.nx*slope)) : 9;
    const rightLine = v.nx>0 ? Math.abs(v.ny - (apexY - v.nx*slope)) : 9;
    const closeEnough = Math.min(leftLine, rightLine);
    if(closeEnough<.07 && Math.abs(v.nx)<.40 && Math.abs(v.nz)<.18) sym = 1.0;
  } else if(symIdx===1){
    // Square L — vertical line + horizontal line meeting at lower-left
    const vert = (Math.abs(v.nx+.30)<.05 && v.ny>-.30 && v.ny<.30 && Math.abs(v.nz)<.18);
    const horiz = (Math.abs(v.ny+.30)<.05 && v.nx>-.30 && v.nx<.20 && Math.abs(v.nz)<.18);
    if(vert||horiz) sym = 1.0;
  } else if(symIdx===2){
    // Navel • — bright single sphere at center
    const d = Math.sqrt(v.nx*v.nx+v.ny*v.ny+v.nz*v.nz);
    sym = Math.exp(-Math.pow(d/.10,2)) * 1.2;
  } else {
    // Knee mark — horizontal line low
    if(Math.abs(v.ny+.45)<.04 && Math.abs(v.nx)<.40 && Math.abs(v.nz)<.18) sym = 1.0;
  }
  sym *= symFade * (.85 + BEAT.beatPulse*.50);
  // Phrase event: ALL four symbols briefly flash
  const reveal = (BEAT.barNum===0 ? BEAT.phrasePulse : 0);
  // Background veil pulses with bar
  const veilPulse = ripple * (.7 + BEAT.barPulse*.4);
  const total = veilPulse + sym + reveal*.25;
  if(total<.07) return [0,0,0];
  if(sym>.25){
    // Sacred mark = bright gold
    return [total*1.0+sym*.3, total*.85+sym*.20, total*.45];
  }
  // Veil = warm white-gold drape
  return [total*.88, total*.85, total*.92];
};

// 10) HOLD on Kolob — single voxel, breathing locked to the bar
Scenes.holdKolob = (v,t,localT)=>{
  const r = Math.sqrt(v.nx*v.nx + v.ny*v.ny + v.nz*v.nz);
  // Breath = one inhale/exhale per bar
  const breath = .70 + .30*(.5 - .5*Math.cos(BEAT.barPhase*Math.PI*2));
  const core = expBell(r/.10, 1.0) * 1.5 * breath;
  if(core<.10) return [0,0,0];
  return [core*1.0, core*.88, core*.55];
};

// ───────────────────────────────────────────────────────────
// TIMELINE  (total ~250 sec = 4:10)
// ───────────────────────────────────────────────────────────
const PROGRAM=[
  {name:'CREATION — spiral vortex',    scene:'creation',   dur:28, color:'#88aaff', spillR:.45, spillG:.55, spillB:.95},
  {name:'KOLOB — the governing star',  scene:'kolob',      dur:24, color:'#ffd58a', spillR:1.0, spillG:.85, spillB:.50},
  {name:'144 WORLDS · 15 SEALED',      scene:'worlds',     dur:26, color:'#cce0e8', spillR:.65, spillG:.80, spillB:.95},
  {name:'THREE GREAT SUNS · stacked',  scene:'threeSuns',  dur:24, color:'#ff99dd', spillR:.95, spillG:.65, spillB:.85},
  {name:'TWELVE GOVERNING SYSTEMS',    scene:'twelve',     dur:24, color:'#ffd58a', spillR:.95, spillG:.80, spillB:.60},
  {name:'THE GARDEN',                  scene:'garden',     dur:24, color:'#7fdd9a', spillR:.50, spillG:1.0, spillB:.60},
  {name:'TREES OF KNOWLEDGE & LIFE',   scene:'trees',      dur:22, color:'#ffaa55', spillR:.95, spillG:.70, spillB:.50},
  {name:'TELESTIAL KINGDOM',           scene:'telestial',  dur:22, color:'#6a7a8a', spillR:.40, spillG:.45, spillB:.55},
  {name:'TERRESTRIAL KINGDOM',         scene:'terrestrial',dur:22, color:'#bbcc66', spillR:.75, spillG:.85, spillB:.45},
  {name:'VEIL + SYMBOLS',              scene:'veil',       dur:24, color:'#ffe3a0', spillR:1.0, spillG:.90, spillB:.65},
  {name:'HOLD — Kolob alone',          scene:'holdKolob',  dur:8,  color:'#ffd58a', spillR:1.0, spillG:.85, spillB:.50}
];
const TOTAL_DUR = PROGRAM.reduce((s,p)=>s+p.dur,0);
const TRANS_LEN = 2.6; // seconds cross-fade between scenes

// Compute start times
let acc=0;
PROGRAM.forEach(p=>{ p.start=acc; acc+=p.dur; });

// ───────────────────────────────────────────────────────────
// TIMELINE UI
// ───────────────────────────────────────────────────────────
const tlTrack=document.getElementById('tl-track');
const tlHead=document.getElementById('tl-head');
const tlNow=document.getElementById('tlNow');
const tlNext=document.getElementById('tlNext');
const tlClock=document.getElementById('tlClock');
PROGRAM.forEach((p,i)=>{
  const s=document.createElement('div');
  s.className='tl-seg';
  s.dataset.i=i;
  s.style.left=(p.start/TOTAL_DUR*100)+'%';
  s.style.width=(p.dur/TOTAL_DUR*100)+'%';
  s.title=p.name+' · '+fmtSec(p.start)+'–'+fmtSec(p.start+p.dur);
  s.textContent=p.name.split(' — ')[0].split(' · ')[0];
  s.addEventListener('click',(e)=>{
    e.stopPropagation();
    seekTo(p.start);
  });
  tlTrack.appendChild(s);
});
function fmtSec(s){const m=Math.floor(s/60), x=Math.floor(s%60); return `${m}:${x<10?'0':''}${x}`}
function seekTo(sec){
  playhead = Math.max(0, Math.min(TOTAL_DUR-.05, sec));
  if(audioActive){
    audioStartT = audioCtx.currentTime - playhead;
    lastBeatScheduled = -1;
  }
  paused=false; bPause.textContent='⏸ PAUSE';
}
// Click-anywhere-on-track to scrub to that time
tlTrack.addEventListener('click',(e)=>{
  const rect=tlTrack.getBoundingClientRect();
  const frac=(e.clientX-rect.left)/rect.width;
  seekTo(frac*TOTAL_DUR);
});

function fmt(sec){const m=Math.floor(sec/60), s=Math.floor(sec%60); return `${m}:${s<10?'0':''}${s}`}

// ───────────────────────────────────────────────────────────
// CAMERA — orbit with presets
// ───────────────────────────────────────────────────────────
let camTheta=.7, camPhi=.18, camDist=4.5;
let tTheta=camTheta, tPhi=camPhi, tDist=camDist;
let lookAt=new THREE.Vector3(0,CY,0), tLookAt=lookAt.clone();
let autoOrbit=true;
let isDragging=false, prevX=0, prevY=0;

renderer.domElement.addEventListener('mousedown',e=>{isDragging=true; autoOrbit=false; prevX=e.clientX; prevY=e.clientY});
renderer.domElement.addEventListener('mousemove',e=>{
  if(!isDragging) return;
  tTheta+=(e.clientX-prevX)*.006;
  tPhi=Math.max(-.4,Math.min(Math.PI/2-.05,tPhi-(e.clientY-prevY)*.006));
  prevX=e.clientX; prevY=e.clientY;
});
renderer.domElement.addEventListener('mouseup',()=>isDragging=false);
renderer.domElement.addEventListener('wheel',e=>{tDist=Math.max(1.6,Math.min(20,tDist+e.deltaY*.005))});

let touchD=0;
renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDragging=true; autoOrbit=false; prevX=e.touches[0].clientX; prevY=e.touches[0].clientY}
  if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY; touchD=Math.sqrt(dx*dx+dy*dy)}
});
renderer.domElement.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    tTheta+=(e.touches[0].clientX-prevX)*.006;
    tPhi=Math.max(-.4,Math.min(Math.PI/2-.05,tPhi-(e.touches[0].clientY-prevY)*.006));
    prevX=e.touches[0].clientX; prevY=e.touches[0].clientY;
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.sqrt(dx*dx+dy*dy); tDist=Math.max(1.6,Math.min(20,tDist-(d-touchD)*.01)); touchD=d;
  }
},{passive:false});
renderer.domElement.addEventListener('touchend',()=>isDragging=false);

document.querySelectorAll('#views span').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#views span').forEach(s=>s.classList.remove('active'));
    b.classList.add('active');
    const v=b.dataset.v;
    autoOrbit=(v==='orbit');
    if(v==='front'){tTheta=Math.PI/2; tPhi=.05; tDist=4}
    else if(v==='34'){tTheta=.7; tPhi=.15; tDist=4.5}
    else if(v==='side'){tTheta=0; tPhi=.05; tDist=4}
    else if(v==='top'){tTheta=0; tPhi=1.2; tDist=5}
  });
});

// ───────────────────────────────────────────────────────────
// TRANSPORT
// ───────────────────────────────────────────────────────────
// (playhead / paused / loopProgram declared at top of script)
const bRestart=document.getElementById('bRestart');
const bPause=document.getElementById('bPause');
const bLoop=document.getElementById('bLoop');
bRestart.addEventListener('click',()=>{playhead=0});
bPause.addEventListener('click',()=>{paused=!paused; bPause.textContent=paused?'▶ PLAY':'⏸ PAUSE'});
bLoop.addEventListener('click',()=>{loopProgram=!loopProgram; bLoop.textContent=loopProgram?'↻ LOOP':'→ ONCE'});

// Hot-keys
addEventListener('keydown',e=>{
  if(e.key===' '){paused=!paused; bPause.textContent=paused?'▶ PLAY':'⏸ PAUSE'; e.preventDefault()}
  else if(e.key==='r'){playhead=0}
  else if(e.key==='ArrowRight'){playhead=Math.min(TOTAL_DUR-.5, playhead+5)}
  else if(e.key==='ArrowLeft'){playhead=Math.max(0, playhead-5)}
});

// ───────────────────────────────────────────────────────────
// SCENE EVALUATION  (with cross-fade)
// ───────────────────────────────────────────────────────────
function findScene(ph){
  for(let i=0;i<PROGRAM.length;i++){
    if(ph < PROGRAM[i].start+PROGRAM[i].dur) return i;
  }
  return PROGRAM.length-1;
}
function evalProgram(arr, t){
  const phMod = loopProgram ? (playhead%TOTAL_DUR) : Math.min(playhead, TOTAL_DUR-.01);
  beatClock(phMod);                              // <-- update BEAT for all scenes
  const idx=findScene(phMod);
  const cur=PROGRAM[idx];
  const localT = phMod - cur.start;
  const fadeIn  = clamp01(localT/TRANS_LEN);
  const tailFrom= cur.dur - TRANS_LEN;
  const fadeOut = (localT>tailFrom && idx<PROGRAM.length-1) ? clamp01((cur.dur-localT)/TRANS_LEN) : 1;
  // next scene if we're in fade-out
  let nextIdx = idx;
  let blend = 0;
  if(localT > tailFrom && idx<PROGRAM.length-1){
    nextIdx=idx+1;
    blend = clamp01((localT - tailFrom)/TRANS_LEN);
  }
  const curFn = Scenes[cur.scene];
  const nxtFn = nextIdx!==idx ? Scenes[PROGRAM[nextIdx].scene] : null;
  let energy=0;
  for(let i=0;i<vox.length;i++){
    const v=vox[i];
    let c = curFn(v,t,localT,cur.dur);
    if(nxtFn){
      const cn = nxtFn(v,t, localT - tailFrom, PROGRAM[nextIdx].dur);
      c = [c[0]*(1-blend)+cn[0]*blend, c[1]*(1-blend)+cn[1]*blend, c[2]*(1-blend)+cn[2]*blend];
    }
    // entry fade-in for first scene + global breath
    const open = (idx===0) ? fadeIn : 1;
    arr[i*3  ] = c[0]*open;
    arr[i*3+1] = c[1]*open;
    arr[i*3+2] = c[2]*open;
    energy += (c[0]+c[1]+c[2]);
  }
  // Spill light interpolation
  let sR=cur.spillR, sG=cur.spillG, sB=cur.spillB;
  if(nxtFn){
    const n=PROGRAM[nextIdx];
    sR=sR*(1-blend)+n.spillR*blend;
    sG=sG*(1-blend)+n.spillG*blend;
    sB=sB*(1-blend)+n.spillB*blend;
  }
  spill.color.setRGB(sR,sG,sB);
  // HUD
  document.getElementById('hScene').textContent=cur.name;
  document.getElementById('hEnergy').textContent=(energy/vox.length).toFixed(2);
  tlNow.textContent=cur.name;
  tlClock.textContent=`${fmt(phMod)} / ${fmt(TOTAL_DUR)}`;
  const nIdx = idx<PROGRAM.length-1 ? idx+1 : (loopProgram?0:-1);
  tlNext.textContent = nIdx>=0 ? `next: ${PROGRAM[nIdx].name}` : 'end';
  tlHead.style.left = (phMod/TOTAL_DUR*100)+'%';
  document.querySelectorAll('.tl-seg').forEach((s,i)=>{
    s.classList.toggle('active', i===idx);
  });
}

// ───────────────────────────────────────────────────────────
// RENDER LOOP (voxel updates @ 24Hz, render every frame)
// ───────────────────────────────────────────────────────────
const colorAttr=vGeo.getAttribute('color');
let lastVox=0;
const VOX_HZ=30;
let lastFrame=performance.now();
let fpsAvg=60;
let lastWall=performance.now();

function animate(time){
  requestAnimationFrame(animate);
  const t=time*.001;
  const dtMs=time-lastWall; lastWall=time;
  if(!paused){
    if(audioActive){
      // Lock playhead to audio clock so visuals stay perfectly synced
      let ap = audioCtx.currentTime - audioStartT;
      if(loopProgram){
        if(ap >= TOTAL_DUR){
          audioStartT += TOTAL_DUR;
          ap -= TOTAL_DUR;
        }
        playhead = ap;
      } else {
        playhead = Math.min(ap, TOTAL_DUR-.01);
        if(playhead >= TOTAL_DUR-.01){ paused=true; bPause.textContent='▶ PLAY' }
      }
    } else {
      playhead += dtMs*.001;
      if(playhead >= TOTAL_DUR){
        if(loopProgram) playhead = playhead % TOTAL_DUR;
        else { playhead = TOTAL_DUR-.01; paused=true; bPause.textContent='▶ PLAY' }
      }
    }
  }
  // Tick beat clock at full render rate so the kick reads tight
  beatClock(loopProgram ? (playhead%TOTAL_DUR) : Math.min(playhead, TOTAL_DUR-.01));
  // Schedule audio events just-ahead-of-time
  tickAudioScheduler();
  // Update pad chord when scene changes
  {
    const phMod = loopProgram ? (playhead%TOTAL_DUR) : Math.min(playhead, TOTAL_DUR-.01);
    const sc = PROGRAM[findScene(phMod)];
    if(audioActive && currentPadKey!==sc.scene) setSceneChord(sc.scene);
  }

  // Auto orbit
  if(autoOrbit){
    tTheta += .0015;
    tPhi = .15 + Math.sin(t*.18)*.05;
    tDist = 4.5 + Math.sin(t*.12)*.4;
  }
  camTheta += (tTheta-camTheta)*.06;
  camPhi   += (tPhi-camPhi)*.06;
  camDist  += (tDist-camDist)*.06;
  lookAt.lerp(tLookAt,.04);
  camera.position.set(
    lookAt.x+Math.sin(camTheta)*Math.cos(camPhi)*camDist,
    lookAt.y+Math.sin(camPhi)*camDist,
    lookAt.z+Math.cos(camTheta)*Math.cos(camPhi)*camDist);
  camera.lookAt(lookAt);

  // Voxel update
  if(time-lastVox > 1000/VOX_HZ){
    lastVox=time;
    evalProgram(colorAttr.array, t);
    colorAttr.needsUpdate=true;
  }
  // Spill intensity now beat-driven — kick on every beat, big swell each bar
  const cur=PROGRAM[findScene(loopProgram ? playhead%TOTAL_DUR : Math.min(playhead,TOTAL_DUR-.01))];
  const baseInt = (cur.scene==='fire') ? 2.6 : (cur.scene==='holdKolob') ? 1.6 :
                  (cur.scene==='cloud') ? .95 : 1.3;
  spill.intensity = baseInt * (.65 + BEAT.beatPulse*.55 + BEAT.swell*.25);

  // Beat indicators (4 dots — one lights per beat in the bar)
  const beatDots=document.querySelectorAll('#beat span');
  beatDots.forEach((d,i)=>{
    const lit = (i===BEAT.beatNum) && BEAT.beatPulse>.15;
    d.classList.toggle('on', lit);
  });
  document.getElementById('tBar').textContent='bar '+(BEAT.barIdx%999);
  document.getElementById('tSwell').style.width=(BEAT.swell*100).toFixed(0)+'%';

  // FPS
  const dt=time-lastFrame; lastFrame=time;
  fpsAvg = fpsAvg*.95 + (1000/Math.max(1,dt))*.05;
  document.getElementById('hFps').textContent=fpsAvg.toFixed(0);

  renderer.render(scene,camera);
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate(0);
</script>
